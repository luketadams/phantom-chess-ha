name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt every job into Node 24 for action runtimes. GitHub deprecated Node
# 20 in Sep 2025 and the runners switch the default to Node 24 in June
# 2026; setting this flag now removes the deprecation warning and gives
# us early visibility into compat issues.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  matrix-tests:
    # The matrix.py module is pure functions (no Home Assistant, no async,
    # no BLE) so its tests run on a stock Python environment without
    # any HA scaffolding. This gives us a fast first-line signal that
    # the FEN ↔ phantom-matrix conversions and sensor consistency
    # checks haven't regressed.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        # aiohttp is needed because lichess_analysis.py imports it at
        # module top (its LichessAnalysisClient uses HA's aiohttp session).
        # Pure-Python install, ~50KB, fast.
        #
        # pytest/pytest-asyncio are pinned (Fable5 deep dive A1,
        # 2026-07-06) so this job stops floating onto whatever pytest
        # ships the day CI happens to run — that's what let the
        # pytest-9.1 collection crash (see FINDINGS_TEST_PORTABILITY.md)
        # land in a job we can't see fail (ha-tests ran continue-on-error
        # at the time). No phacc here, so no transitive constraint to
        # match — these are just the latest verified-good releases as of
        # 2026-07-06 (pytest 9.1.1, pytest-asyncio 1.3.0).
        run: |
          python -m pip install --upgrade pip
          pip install pytest==9.1.1 pytest-asyncio==1.3.0 'chess>=1.10.0,<2.0' pyyaml aiohttp
      - name: Run pure-function tests
        # The tests/conftest.py stub stages matrix.py + dashboard_provision.py
        # + lichess_analysis.py into sys.modules with stubbed homeassistant.*
        # symbols, so these tests run on a minimal Python install.
        # test_config_flow.py and any other HA-dependent tests gracefully
        # skip via pytest.importorskip()'ing pytest-homeassistant-custom-component
        # (only installed in the ha-tests job).
        #
        # Fable5 deep dive A1 (2026-07-06): this used to run a hardcoded
        # 8-file list while claiming to be the gating job — a coverage/
        # regression collapse in any other file under tests/ would go
        # completely unnoticed. Point it at the full directory now that
        # we've confirmed (2026-07-06 sandbox run) the whole minimal-env
        # suite passes here in ~7s with no HA scaffolding required.
        run: |
          PYTHONPATH=. pytest tests/ -v

  ha-tests:
    # The config_flow tests use pytest-homeassistant-custom-component
    # which pulls in the full HA dependency tree. They're skipped
    # gracefully if the plugin isn't installed (see tests/test_config_flow.py).
    # We install it here so the tests actually run in CI.
    #
    # Fable5 deep dive A1 (2026-07-06): this was the ONLY job running the
    # full ~885-test suite and enforcing fail_under=95, but continue-on-error
    # meant a coverage collapse (or a total install failure) still showed
    # green. Gating for real now that the version underneath it is pinned
    # instead of floating — see the pin rationale below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install HA test scaffolding
        # pytest-homeassistant-custom-component pulls HA core + pytest +
        # most fixtures, but NOT optional integration deps.
        # phantom_chess.config_flow imports homeassistant.components.bluetooth
        # which transitively pulls in:
        #   bluetooth → usb → aiousbwatcher (Linux inotify watcher)
        #   bluetooth → usb → utils → pyserial (the `serial` module)
        # Plus the integration's own runtime dep:
        #   chess (python-chess, for AI move generation + board state)
        # And coverage.py for the Silver `test-coverage` rule's trend
        # tracking (fail_under threshold lives in pyproject.toml).
        #
        # VERSION PIN — read before bumping (Fable5 deep dive A1, 2026-07-06):
        # pytest-homeassistant-custom-component tracks HA core 1:1 (each
        # phacc release == one homeassistant release) and HA moved its
        # Python floor to >=3.14 starting with HA 2026.3 (phacc 0.13.317+
        # all declare Requires-Python >=3.14, verified against PyPI
        # 2026-07-06). This runner is on Python 3.13, so 0.13.316 —
        # tracking HA 2026.2.3, released 2026-02-21 — is the newest phacc
        # release this job can install at all. That means this job now
        # gates on a real HA snapshot instead of silently no-op'ing, but
        # it's a ~5-month-old HA snapshot until someone deliberately bumps
        # this job to Python 3.14 to follow current HA (a separate,
        # bigger decision — not folded into this pin).
        # pytest==9.0.0 and coverage==7.10.6 are pinned to match exactly
        # what pytest-homeassistant-custom-component==0.13.316 itself
        # declares in its own install_requires (see its
        # requirements_test.txt at that tag) — installing a newer pytest
        # here would conflict with phacc's internal exact pin and fail
        # to resolve.
        run: |
          python -m pip install --upgrade pip
          pip install pytest==9.0.0 pytest-homeassistant-custom-component==0.13.316 \
                      aiousbwatcher pyserial \
                      'chess>=1.10.0,<2.0' \
                      coverage==7.10.6
      - name: Run HA-integration tests with coverage
        # coverage run records hits across the whole package; coverage
        # report enforces the fail_under threshold set in pyproject.toml.
        # The package-relative source path is configured under
        # [tool.coverage.run] in pyproject.toml.
        run: |
          PYTHONPATH=. coverage run -m pytest tests/ -v
      - name: Coverage report (informational + fail_under gate)
        run: |
          coverage report

  typecheck:
    # Platinum quality scale prep — mypy must be clean.
    # Gating as of alpha25; prior alphas ran this as continue-on-error
    # while we drove the baseline from 17 errors down to 0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install mypy + deps
        # mypy pinned (Fable5 deep dive A1, 2026-07-06) — latest verified
        # release as of that date, no HA scaffolding involved so no
        # transitive-pin conflict to worry about here.
        run: |
          python -m pip install --upgrade pip
          pip install mypy==2.1.0 'chess>=1.10.0,<2.0' pyyaml aiohttp
      - name: Run mypy
        # --ignore-missing-imports because we don't install HA core
        # here (way too heavy for a type check pass); HA's own types
        # show up via stubs in pytest-homeassistant-custom-component
        # if needed later. With those stubs unavailable, mypy treats
        # `homeassistant.*` as Any — still catches our own type bugs.
        run: |
          PYTHONPATH=. python -m mypy --ignore-missing-imports \
            --no-incremental \
            custom_components/phantom_chess/

  ruff:
    # Code-quality linter — catches unused imports, undefined names,
    # mutable default args, F-style errors. Faster than pyflakes/flake8.
    # alpha26 brought the baseline to zero; this job is gating from
    # the start so future PRs that introduce ruff warnings fail CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        # Pinned (Fable5 deep dive A1, 2026-07-06) — latest verified
        # release as of that date.
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.20
      - name: Run ruff
        run: |
          python -m ruff check custom_components/phantom_chess/

  lint:
    # Light-touch static checks — syntax, manifest shape. Complements
    # the `ruff` job: catches things ruff doesn't (manifest shape,
    # hacs.json structure, compileall-style syntax errors).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile all Python files
        run: python -m compileall -q custom_components/
      - name: Validate manifest.json
        run: |
          python -c "
          import json, sys
          m = json.load(open('custom_components/phantom_chess/manifest.json'))
          required = {'domain', 'name', 'version', 'documentation', 'issue_tracker', 'codeowners'}
          missing = required - set(m.keys())
          assert not missing, f'manifest.json missing keys: {missing}'
          assert m['domain'] == 'phantom_chess', f'unexpected domain: {m[\"domain\"]}'
          print(f'manifest.json OK — version {m[\"version\"]}')
          "
      - name: Validate hacs.json
        run: |
          python -c "
          import json
          h = json.load(open('hacs.json'))
          assert 'name' in h, 'hacs.json missing name'
          assert 'homeassistant' in h, 'hacs.json missing homeassistant version floor'
          print(f'hacs.json OK — name={h[\"name\"]!r} ha-floor={h[\"homeassistant\"]}')
          "
