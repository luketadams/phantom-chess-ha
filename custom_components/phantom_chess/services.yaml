start_game:
  name: Start Game
  description: >
    Start a new chess game against the Lichess AI. The board switches to chess-play
    mode and a Lichess AI challenge is created. Physical moves are relayed from the
    board to Lichess; AI moves are relayed back and executed mechanically.
  fields:
    ai_level:
      name: AI Level
      description: Lichess Stockfish level (1 = easiest, 8 = hardest). Defaults to the current selector value.
      required: false
      selector:
        number:
          min: 1
          max: 8
          step: 1
          mode: slider
    color:
      name: Color
      description: Which side to play as. Defaults to the current selector value.
      required: false
      selector:
        select:
          options:
            - white
            - black
            - random
    clock_limit_seconds:
      name: Clock limit (seconds)
      description: >
        Optional time control. Initial clock per side in seconds (60–10800,
        i.e. 1 minute to 3 hours). Omit for an unlimited (correspondence-style)
        game. Must be paired with a valid increment.
      required: false
      selector:
        number:
          min: 60
          max: 10800
          step: 60
          unit_of_measurement: s
          mode: box
    clock_increment_seconds:
      name: Clock increment (seconds)
      description: >
        Optional Fischer increment added per move, in seconds (0–180). Only
        used when a clock limit is set.
      required: false
      selector:
        number:
          min: 0
          max: 180
          step: 1
          unit_of_measurement: s
          mode: box
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

send_move:
  name: Send Move
  description: >
    Manually inject a move in UCI notation (e.g. "e2e4"). Useful for testing or for
    external services pushing moves to the board.
  fields:
    move:
      name: Move
      description: UCI move string, e.g. "e2e4", "g8f6", "e1g1" (kingside castle).
      required: true
      selector:
        text:
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

start_local_game:
  name: Start Local Game
  description: >
    Start a game against the built-in AI — no Lichess account or internet required.
    Tries stockfish (if installed), then Lichess cloud eval, then random legal moves.
  fields:
    color:
      name: Color
      description: Which side to play as. Defaults to the current selector value.
      required: false
      selector:
        select:
          options:
            - white
            - black
            - random
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

stop_local_game:
  name: Stop Local Game
  description: End the local AI game and return the board to idle mode.
  fields:
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

resign:
  name: Resign
  description: Resign the current game on Lichess.
  fields:
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

back_to_modes:
  name: Back to Modes
  description: >
    Return to the mode picker AND re-home the board. Dismisses the post-game
    review, resets `select.<device>_setup_mode` to "Choose a mode", and drives
    the physical pieces back to the starting position (also finalizes and saves
    a two-player recording if one is active). The board re-home is best-effort —
    a disconnected board still returns the dashboard to the picker. Replaces the
    v0.3 `script.phantom_back_to_modes` so the bundled dashboard can call this
    service directly.
  fields:
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

start_two_player_game:
  name: Start Two-Player Recording
  description: >
    Start a two-human recording game on the physical board (SIDE-0
    2-local-player firmware mode, no AI/Lichess opponent). Each detected move is
    run through the analysis pipeline so the live learning view populates, and a
    PGN is saved under `<config>/phantom_chess/recordings/` when the game ends.
  fields:
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

resync_detection:
  name: Re-sync Board Detection (wedge recovery)
  description: >
    Recovery for a board stuck in "Snapping Pieces" / "Chessboard and sensor
    matrix do not match" even though the pieces are correctly placed. Sends
    RESET_DETECTION (opcode 14) to re-seed the firmware's internal expected
    matrix to the integration's current position (the standard start position
    when idle), telling the firmware to accept the board as-is. This is a data
    re-sync — it does NOT drive the magnet/pieces — so it's safe to run while
    the board is wedged. Requires the board to be connected via Bluetooth.
  fields:
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

resync_two_player:
  name: Resync Two-Player Board
  description: >
    Recovery action for a two-player recording that has gone out of sync (for
    example after an illegal physical move was rejected). Re-drives the physical
    pieces back to the last recorded position so the board and the dashboard
    agree again; the recorded move history is left untouched. EXPERIMENTAL —
    behaviour in 2-local-player mode still needs live-hardware verification.
  fields:
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

start_lichess_configured:
  name: Start Lichess Game (Configured)
  description: >
    Start a Lichess Board API game using the integration's currently-set
    select / number entities (`select.<device>_player_color`,
    `select.<device>_ai_level`, `number.<device>_lichess_clock_minutes`,
    `number.<device>_lichess_clock_increment`). The minute value is
    multiplied by 60 to form Lichess's seconds-based `clock.limit`.
    Replaces the v0.3 `script.phantom_start_lichess_configured`.
  fields:
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

play_selected_sculpture:
  name: Play Selected Sculpture
  description: >
    Play the historic game currently selected in
    `select.<device>_sculpture_game` on the physical board — exactly ONE
    game, driven by the integration move-by-move via the same snapshot
    protocol AI-vs-AI uses, then stop. Unlike the pre-beta3 behaviour (which
    entered the firmware's sculpture mode and let the board autonomously loop
    through its built-in library), only the selected game plays. Move data
    for all 18 catalog games is bundled in `sculpture_games.json`. Put the
    pieces in the start position first. Stop early with `back_to_modes` or
    `stop_local_game`.
  fields:
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

start_ai_vs_ai_game:
  name: Start AI-vs-AI Game
  description: >
    Run a Stockfish-vs-Stockfish game on the physical board. Both sides
    are played by the local Stockfish engine via the same snapshot
    protocol used for normal AI moves; the magnet physically moves
    pieces for both colors. Useful for autonomous protocol testing (e.g.,
    castle handling, BLE timing) and as a "watch the AI play itself"
    demo. Stops on checkmate/stalemate/draw or when the
    stop_local_game service is called.
  fields:
    white_ai_level:
      name: White AI Level
      description: >
        Stockfish skill for white (1 = easiest, 8 = strongest). Defaults
        to the integration's current ai_level select.
      example: 3
      selector:
        number:
          min: 1
          max: 8
          mode: box
    black_ai_level:
      name: Black AI Level
      description: >
        Stockfish skill for black (1 = easiest, 8 = strongest). Defaults
        to the same as white_ai_level.
      example: 3
      selector:
        number:
          min: 1
          max: 8
          mode: box
    move_delay_seconds:
      name: Move delay (seconds)
      description: >
        Seconds to wait between move completions. Lower values run
        games faster but stress the magnet and BLE link harder. Defaults
        to 1.5s.
      example: 1.5
      default: 1.5
      selector:
        number:
          min: 0
          max: 60
          step: 0.5
          mode: box
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

takeback:
  name: Request Takeback
  description: >
    Undo the last N plies on the physical board and in integration state.
    For Lichess games, requests the takeback through the Lichess Board API
    first; if Lichess refuses (game state not eligible), no BLE write fires
    so the board stays in sync with the active Lichess game. For local
    Stockfish games and no-game-active sessions, rolls back the internal
    board unconditionally and repositions physical pieces via opcode 5 on
    UUID_GAME. Wire format and semantics confirmed by Phantom team
    (Efraín, 2026-05-24).
  fields:
    count:
      name: Plies to undo
      description: >
        Number of half-moves to roll back. Default 1. Use 2 to undo a full
        move pair (your move plus the opponent's).
      example: 1
      default: 1
      selector:
        number:
          min: 1
          max: 20
          mode: box
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

debug_ble_write:
  name: Debug BLE Write
  description: >
    Diagnostic — write an arbitrary payload to an arbitrary BLE characteristic
    on the connected board. Use to probe firmware 0.3.0 behavior. The data
    string is UTF-8 encoded by default; prefix with "hex:" for raw bytes
    (e.g. "hex:0102FF").
  fields:
    uuid:
      name: Characteristic UUID
      description: Full 128-bit UUID with dashes, e.g. "5e316147-4550-4cf3-8e2b-edc098312a43".
      required: true
      selector:
        text:
    data:
      name: Payload
      description: ASCII payload (e.g. "M e2-e4", "1") or "hex:..." for raw bytes.
      required: true
      selector:
        text:
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

diagnose_game_start:
  name: Diagnose Game Start (fw0.3.2)
  description: >
    Diagnostic for the firmware 0.3.2 GAME_START length rejection. Logs the
    negotiated ATT MTU and the UUID_GAME characteristic's write limits, then
    runs a non-destructive RESET_DETECTION (opcode 14) size probe to localise
    the firmware's accepted write length. Read the "0.3.2 diag" / "diagnose_
    game_start" lines in the HA log after calling. With experimental enabled it
    also A/B-tests the candidate GAME_START write variants on the live board —
    a variant the firmware accepts will start a game.
  fields:
    experimental:
      name: Experimental — try GAME_START write variants live
      description: >
        If on, after the safe probe the action attempts the real GAME_START
        write variants (doc-compliant 103-byte, experimental 101-byte no-suffix,
        then write-without-response), stopping at the first the firmware
        accepts. A successful variant starts a game; rejected writes have no
        effect. Leave off for a purely non-destructive diagnosis.
      required: false
      default: false
      selector:
        boolean:
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

phantom_start_game:
  name: Phantom Start Game (confirmed protocol)
  description: >
    Start a chess game using the activation sequence captured from the official
    Phantom Android app. After this is invoked, you MUST physically lift any
    piece on the board and place it back to break the firmware's
    Setting Up ↔ Managing Mismatch oscillation. Once the firmware enters
    Running mode, the integration sends the side opcode and tracking begins.
  fields:
    fen:
      name: FEN
      description: Position FEN to set up. Defaults to the standard starting position.
      required: false
      selector:
        text:
    side:
      name: Side to move first
      description: W = white moves first, B = black moves first.
      required: false
      selector:
        select:
          options: [W, B]
    timeout:
      name: Wait timeout (seconds)
      description: How long to wait for firmware Running mode after gameStart. Default 60.
      required: false
      selector:
        number:
          min: 5
          max: 300
          step: 5
          mode: box
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

phantom_apply_ai_move:
  name: Phantom Apply AI Move
  description: >
    Apply an engine/AI move to the board after a human move has been detected.
    Issues movementVerify + side flip + movement using the confirmed protocol.
    The firmware physically moves the piece via the magnet head.
  fields:
    move:
      name: UCI move
      description: UCI notation of the AI's move, e.g. 'e7e5', 'g8f6'.
      required: true
      selector:
        text:
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

reconcile_lichess_state:
  name: Reconcile Lichess State
  description: >
    Query Lichess directly for the current state of the in-progress game and
    sync local sensors if the game has actually ended. Use when the dashboard
    shows lichess_active=on but you've finished the game on your phone or
    web. Safe to call at any time — no-op if Lichess still says the game is
    active. Also auto-triggers when the stream task dies unexpectedly.
  fields:
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

resume_from_phone:
  name: Resume from Phone
  description: >
    Push the integration's current board state to the physical board so it
    catches up with moves you played on Lichess.org or your phone while the
    physical drive was failing. Use after the "AI move not delivered"
    notification appears: continue the game on your phone, then call this
    service when the board is ready to resume physical play. The integration
    sends a RESET_DETECTION (opcode 14) snapshot to firmware so it knows the
    current position without driving the magnet.
  fields:
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

move_piece:
  name: Move Piece (raw firmware)
  description: >
    Low-level move primitive — instructs the firmware to physically move a
    piece via the magnet head without checking game state or move legality.
    Use to set up arbitrary positions or to recover from a state mismatch
    where the integration's internal board has drifted from the firmware's
    "Setting Up" pose. Most users want execute_move or send_move instead;
    move_piece bypasses chess.Board validation entirely.
  fields:
    from_square:
      name: From square
      description: Source square in algebraic notation, e.g. "e2".
      required: true
      selector:
        text:
    to_square:
      name: To square
      description: Destination square in algebraic notation, e.g. "e4".
      required: true
      selector:
        text:
    capture:
      name: Capture
      description: True if the move should also lift the captured piece to the graveyard.
      required: false
      default: false
      selector:
        boolean:
    piece:
      name: Promotion piece
      description: >
        Promotion suffix (Q/R/B/N) when promoting a pawn. Use "E" for a
        non-promotion move (default).
      required: false
      default: E
      selector:
        text:
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

start_sculpture:
  name: Start Sculpture Mode
  description: >
    Switch the firmware to sculpture mode (SELECT_MODE = 1). In this mode
    the board plays out famous historical games as a kinetic display
    without expecting human input. Pair with select.<device>_sculpture_game
    to choose which game to play. The playback is driven by the board's own
    firmware once the pieces are in the start position; per-game selection
    from inside the integration is not yet implemented (tracked in
    play_selected_sculpture).
  fields:
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

reset_position:
  name: Reset Position
  description: >
    Drive the physical board and the integration's internal chess.Board
    back to the standard starting position. Use after an aborted game or
    if you've manually rearranged pieces and want a clean reset before
    starting a new game. Sends opcode 0 (GAME_START) on UUID_GAME with the
    starting-position snapshot matrix, side = W.
  fields:
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

play_sound:
  name: Play Firmware Sound
  description: >
    Trigger a check or checkmate sound on the board's onboard speaker
    using opcode 9 (CHECK_SOUND) on UUID_GAME, per the firmware 0.3.0
    protocol. Useful as a confirmation in voice / automation workflows.
  fields:
    sound:
      name: Sound
      description: Which sound to play.
      required: false
      default: check
      selector:
        select:
          options:
            - check
            - checkmate
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

request_hint:
  name: Request Hint
  description: >
    Force-refresh the Lichess cloud-eval / Stockfish-fallback evaluation
    for the current position and publish the engine's best move to
    sensor.<device>_best_move_san. Used by the dashboard's Hint button in
    learning mode. Safe to call at any time; no-op if no game is active.
  fields:
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

dismiss_review:
  name: Dismiss Post-Game Review
  description: >
    Clear the post-game review state so the dashboard returns to the
    mode-picker view. Equivalent to the back_to_modes service but scoped
    to only the review flag — leaves select.<device>_setup_mode unchanged.
    Used internally by back_to_modes; exposed as a service for
    automations that want to drop the review pane without changing the
    user's current mode selection.
  fields:
    entry_id:
      name: Config entry ID
      description: >
        Only needed when more than one Phantom Chess Board is configured.
      example: "01H..."
      selector:
        text:

execute_move:
  name: Execute Move (Dashboard)
  description: >
    Execute a UCI move on behalf of the user, driving the magnet to physically
    move the piece on the board. Distinct from send_move (which assumes the
    user already moved the piece physically). Used by the bundled interactive
    web board at /phantom_chess_static/board.html — embed it in a Lovelace
    iframe card to drag-drop pieces from the dashboard.

    Validates that a game is active, that it's the user's turn, and that the
    move is legal in the current position. For Lichess games, the move is
    POSTed to the Lichess Board API after the magnet drives the piece. For
    local Stockfish games, the AI response is triggered automatically.
  fields:
    move:
      name: UCI move
      description: >
        UCI notation of the move, e.g. "e2e4", "g1f3", "e1g1" (kingside
        castle), "e7e8q" (pawn promotion). The promotion suffix may be
        embedded in the move string, or passed separately via the promotion
        field.
      required: true
      selector:
        text:
    promotion:
      name: Promotion piece
      description: Piece to promote to when a pawn reaches the back rank. Optional; required if the move is a pawn promotion and the UCI string is only 4 characters.
      required: false
      selector:
        select:
          options:
            - q
            - r
            - b
            - n
    entry_id:
      name: Entry ID
      description: ConfigEntry ID of the target board (required if more than one Phantom board is configured).
      required: false
      selector:
        text:
