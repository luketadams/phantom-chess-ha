# Phantom Chess Board — quality scale rule tracking.
#
# Reference: https://developers.home-assistant.io/docs/core/integration-quality-scale/
# Checklist: https://developers.home-assistant.io/docs/core/integration-quality-scale/checklist
#
# Re-audited against the 0.5.0 code (2026-09-27). manifest.json claims
# "platinum": every Bronze, Silver, Gold and Platinum rule below is done or
# exempt. Platinum rules re-checked against the current rule pages
# (async-dependency, inject-websession, strict-typing) on 2026-09-27.

rules:
  # ── Bronze ─────────────────────────────────────────────────────────────
  action-setup:
    status: done
    comment: |
      Services are registered in async_setup via _register_services, so
      they exist before any entry loads. The target board is resolved at
      call time (entry_id, or the only configured board).

  appropriate-polling:
    status: exempt
    comment: |
      Local push (iot_class local_push): Bluetooth notifications and the
      Lichess Board API stream drive state. The coordinator's 30 s
      update_interval is only a safety net.

  brands:
    status: done
    comment: |
      Local brand images in brand/ (icon.png 256x256, icon@2x.png 512x512),
      the HA 2026.3+ mechanism that needs no home-assistant/brands PR. The
      art is square, so the icon doubles as the logo.

  common-modules:
    status: done
    comment: |
      coordinator.py (BLE + game state), sessions.py (local-game
      persistence/recovery), matrix.py (pure board-matrix helpers),
      lichess_analysis.py (evaluation, Stockfish), engine_artifacts.py
      (verified engine install), game_library.py / game_review.py (PGN
      library and review), move_quality.py (grading), homepod_speech.py,
      dashboard_provision.py, issues.py (repair issues), config_flow.py.

  config-flow-test-coverage:
    status: done
    comment: |
      tests/test_config_flow.py covers user flow (valid, invalid, blank
      token, network error, timeout, bad MAC), the discovered-board picker
      and manual-entry step, Bluetooth discovery and its already-configured
      abort, reauth (success and invalid token), reconfigure (token update,
      blank no-op, MAC change rejected, invalid token), options round trip
      and entry migrations.

  config-flow:
    status: done
    comment: |
      UI-only setup. Every field has data_description. entry.data holds the
      board address, Lichess token and user; entry.options holds tunables
      (speech, dashboard provisioning, debug).

  dependency-transparency:
    status: done
    comment: |
      Only runtime requirement: chess (python-chess). Stockfish is not
      vendored; it is downloaded on demand from official Stockfish releases
      or the project's Alpine package mirror and verified against pinned
      SHA-256 digests before use (engine_artifacts.py, docs/ENGINE_ARTIFACTS.md).

  docs-actions:
    status: done
    comment: README "Services" plus services.yaml for every action's fields.

  docs-high-level-description:
    status: done
    comment: README introduction and "What you can do".

  docs-installation-instructions:
    status: done
    comment: README "Install" covers HACS, manual install and setup steps.

  docs-removal-instructions:
    status: done
    comment: |
      README "Removing the integration" lists what is deleted (dashboard,
      engine, caches, copied images) and what is kept (saved games,
      recordings).

  entity-event-setup:
    status: done
    comment: |
      Entities are CoordinatorEntity subclasses; subscriptions follow the
      async_added_to_hass / async_will_remove_from_hass lifecycle.

  entity-unique-id:
    status: done
    comment: 'Every entity sets unique_id "<ADDRESS>_<suffix>" (upper-case address).'

  has-entity-name:
    status: done
    comment: All entity classes set _attr_has_entity_name = True.

  runtime-data:
    status: done
    comment: |
      entry.runtime_data holds the coordinator; typed alias
      PhantomChessConfigEntry = ConfigEntry[PhantomChessCoordinator].

  test-before-configure:
    status: done
    comment: |
      A supplied Lichess token is verified against /api/account before the
      entry is created. The token is optional (local play needs none); a
      blank token skips the request.

  test-before-setup:
    status: exempt
    comment: |
      The board is battery powered and usually off. Raising
      ConfigEntryNotReady while it is away would keep the entry failing;
      instead the coordinator reconnects in the background when the board
      appears, and entities report unavailable meanwhile.

  unique-config-entry:
    status: done
    comment: |
      Bluetooth, user and manual flows set the canonical upper-case address
      as unique_id and abort when it is already configured.

  # ── Silver ─────────────────────────────────────────────────────────────
  action-exceptions:
    status: done
    comment: |
      Every service is registered through _user_facing: refusals raised by
      the coordinator (a game already running, board not ready, bad PGN,
      engine timeout) become ServiceValidationError; Bluetooth failures
      become HomeAssistantError. Both carry translation keys.

  config-entry-unloading:
    status: done
    comment: |
      async_unload_entry shuts the coordinator down (cancels and awaits the
      BLE, game, AI and review tasks, closes Stockfish) and unloads platforms.

  docs-configuration-parameters:
    status: done
    comment: README "Configuration options" lists every options-flow field.

  docs-installation-parameters:
    status: done
    comment: |
      README "Install" and "Lichess token (optional)" cover the Bluetooth
      address and the optional token, including where to create the token.

  entity-unavailable:
    status: done
    comment: |
      Board-backed entities are unavailable while Bluetooth is disconnected;
      the Connected sensor stays available, and pure configuration entities
      (clock, levels, toggles) stay available so they can be set in advance.

  integration-owner:
    status: done
    comment: codeowners lists @luketadams.

  log-when-unavailable:
    status: done
    comment: |
      The BLE loop logs the first failure of an outage at WARNING and later
      retries at DEBUG, then logs the reconnection at INFO.

  parallel-updates:
    status: done
    comment: |
      PARALLEL_UPDATES is 0 on read-only platforms (sensor, binary_sensor,
      image, select) and 1 on platforms that write to the board (button,
      number, switch).

  reauthentication-flow:
    status: done
    comment: |
      A rejected Lichess token starts reauth; the user enters a new token.
      Covered by test_reauth_flow_success / _rejects_invalid_new_token.

  test-coverage:
    status: done
    comment: |
      Above 95 % line coverage on HA 2026.2.3 and 2026.9.3; CI enforces
      fail_under = 95 in pyproject.toml.

  # ── Gold ───────────────────────────────────────────────────────────────
  devices:
    status: done
    comment: One device per board, identified by its Bluetooth address.

  diagnostics:
    status: done
    comment: |
      async_get_config_entry_diagnostics redacts the Lichess token and
      partially masks the board address and Lichess username; includes
      engine and environment state for troubleshooting.

  discovery:
    status: done
    comment: |
      manifest.json declares the board's Bluetooth service UUID; discovered
      boards appear under Discovered and in the user-flow picker.

  discovery-update-info:
    status: exempt
    comment: The Bluetooth address is the only identity; there is no network info to update.

  docs-data-update:
    status: done
    comment: README "How it updates".

  docs-examples:
    status: done
    comment: README "Automation examples"; examples/voice-assist.yaml for voice starts.

  docs-known-limitations:
    status: done
    comment: README "Known limits" and the engine platform note under "Requirements".

  docs-supported-devices:
    status: done
    comment: README "Requirements" (firmware tested, Bluetooth proxy requirement for 0.3.2+).

  docs-supported-functions:
    status: done
    comment: README "The dashboard", "Entities" and "Services".

  docs-troubleshooting:
    status: done
    comment: README "Troubleshooting", including the Repairs entries.

  docs-use-cases:
    status: done
    comment: README "What you can do" and "Automation examples".

  dynamic-devices:
    status: exempt
    comment: One board per config entry; a second board is a second entry.

  entity-category:
    status: done
    comment: |
      Selects, numbers and switches are CONFIG; diagnostic sensors and both
      buttons are DIAGNOSTIC. Primary game state has no category.

  entity-device-class:
    status: done
    comment: |
      Connectivity and running classes on binary sensors; battery and
      duration classes on the battery and clock sensors. Text-like sensors
      (FEN, opening, firmware mode) have no fitting class.

  entity-disabled-by-default:
    status: done
    comment: The Start Game and Movement Verify diagnostic buttons are disabled by default.

  entity-translations:
    status: done
    comment: All entities use translation_key; names live in strings.json.

  exception-translations:
    status: done
    comment: |
      Every ServiceValidationError / HomeAssistantError raised by the
      integration uses translation_domain + translation_key
      (strings.json "exceptions"). Refusals from deep in the coordinator
      carry their detail through the request_rejected placeholder.
      tests/test_issues.py guards against untranslated raises and unknown keys.

  icon-translations:
    status: done
    comment: icons.json supplies default and state-based icons.

  reconfiguration-flow:
    status: done
    comment: |
      Reconfigure adds or rotates the Lichess token; a different board
      address is rejected (that is a new entry).

  repair-issues:
    status: done
    comment: |
      issues.py raises and clears three repair issues the integration can
      observe directly: engine_unsupported_platform, engine_failed (cleared
      when the engine reports ready) and ble_route_unsupported (ATT 0x0D
      game-start rejection on firmware 0.3.2+; cleared by the next
      successful start). The stale 0.4 missing_frontend_deps issue is
      removed at setup.

  stale-devices:
    status: exempt
    comment: One device per config entry, removed with the entry.

  # ── Platinum ───────────────────────────────────────────────────────────
  async-dependency:
    status: done
    comment: |
      python-chess's engine layer is asyncio-native; HTTP uses aiohttp;
      Bluetooth uses bleak through HA. Blocking file work (engine install,
      library files) runs in the executor.

  inject-websession:
    status: done
    comment: |
      Lichess requests and the engine download use HA's shared session
      (async_get_clientsession); the integration never creates its own.

  strict-typing:
    status: done
    comment: |
      The gating CI `typecheck` job runs mypy --strict against Home
      Assistant 2026.9.3's installed types, with no --ignore-missing-imports.
      The dependencies ship py.typed (python-chess; bleak via HA). The typed
      PhantomChessConfigEntry alias (runtime-data) is used for every entry
      the integration handles. The few remaining type: ignore comments each
      carry a specific error code and a stated reason.
