    # busy" view when the learning view is active. Previously this
    # section rendered alongside the learning view's own embedded
    # board, producing two boards stacked vertically during AI-vs-AI,
    # Stockfish, and Lichess play. Keep it for sculpture playback and
    # other modes that don't activate the learning view.
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.phantom_chess_board_idle
        state: 'off'
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_lichess_active
        state: 'off'
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_lichess_review_ready
        state: 'off'
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_learning_view_active
        state: 'off'
      # beta3: sculpture playback has its own dedicated view now, so don't
      # also render this bare-board view during it (would stack two boards).
      - condition: not
        conditions:
        - condition: state
          entity: sensor.phantom_YOUR_BOARD_MAC_lichess_game_id
          state: sculpture
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_connected
