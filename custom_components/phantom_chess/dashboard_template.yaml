            \ collapse by move 24. However, the game\u2019s authenticity is debated, as there\u2019s no conclusive evidence that Einstein and Oppenheimer played chess together, and some suggest it could\
            \ involve Hans Albert Einstein or another player named Einstein.\", \"image\": \"/local/phantom_chess/1933_einstein_oppenheimer.jpg\"}, \"1938 \u2014 Botvinnik vs Capablanca (AVRO)\": {\"white\"\
