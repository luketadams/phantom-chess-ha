            color: grey
          # alpha32: during AI-vs-AI the raw firmware_mode flickers Setting Up<->
          # Board Playing every few sec. Show a steady 'AI vs AI - move N' there
          # (N from move_history plies); other game types keep the raw mode.
          - type: markdown
            content: >-
              {% set m = states('sensor.phantom_YOUR_BOARD_MAC_firmware_mode') %}{% set sm = states('select.phantom_YOUR_BOARD_MAC_setup_mode') %}{% if sm == 'Watch AI vs AI' %}{% set plies = state_attr('sensor.phantom_YOUR_BOARD_MAC_move_history', 'moves') | count %}**🤖 AI vs AI** — move {{ (plies + 1) // 2 }}{% else %}**State:** {{ m }}{% endif %}
