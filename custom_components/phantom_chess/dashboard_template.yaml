    # ── Learning view (C5: mode-aware + side-to-move + oriented eval bar) ───
    # Live-fix 2026-07-08: sculpture playback drives the analysis pipeline,
    # which turns learning_view_active ON — without the exclusion below this
    # view stacked a second board under the dedicated sculpture view (and
    # offered nonsensical Hint/Takeback/Resign during playback).
    - type: conditional
      conditions:
      - entity: binary_sensor.phantom_YOUR_BOARD_MAC_learning_view_active
        state: 'on'
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_connected
        state: 'on'
      - condition: not
        conditions:
        - condition: state
          entity: sensor.phantom_YOUR_BOARD_MAC_lichess_game_id
