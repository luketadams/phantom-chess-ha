                '
            content: "\u26A0 Black threatens **{{ states('sensor.phantom_YOUR_BOARD_MAC_threat_san') }}** next move"
        - type: custom:layout-card
          layout_type: grid
          layout:
            grid-template-columns: 48px 1fr 280px
            grid-gap: 10px
            grid-template-rows: auto
          cards:
          # Vertical eval bar - drawn with card-mod CSS (gradient fill + ::before/::after
          # labels) instead of inline-HTML <div>s. HA's markdown card sanitizes its body
          # with js-xss, whose whitelist allows <div>/<span> as tags but with no
          # attributes - so inline style= is stripped and an inline-HTML bar renders
          # blank. card-mod CSS is injected into the shadow DOM and bypasses that
          # sanitizer. pct + labels are computed by a Jinja template in the style,
          # re-evaluated whenever eval_cp / eval_mate change; the markdown body is hidden.
          - type: markdown
            content: ' '
            card_mod:
              style: |
                {% set cp_raw = states('sensor.phantom_YOUR_BOARD_MAC_eval_cp') %}{% set mate_raw = states('sensor.phantom_YOUR_BOARD_MAC_eval_mate') %}{% set has_mate = mate_raw not in ['', 'unknown', 'unavailable'] %}{% set has_cp = cp_raw not in ['', 'unknown', 'unavailable'] %}{% if has_mate %}{% set mate = mate_raw | int %}{% set pct = 98 if mate > 0 else 2 %}{% set label_top = 'M' + (mate|abs|string) if mate < 0 else '' %}{% set label_bot = 'M' + (mate|abs|string) if mate >= 0 else '' %}{% elif has_cp %}{% set cp = cp_raw | int %}{% set pct = ((cp / 4.0) + 50) | round(0) | int %}{% if pct < 3 %}{% set pct = 3 %}{% elif pct > 97 %}{% set pct = 97 %}{% endif %}{% set cp_str = ('+' if cp >= 0 else '') + ((cp/100.0) | round(1) | string) %}{% set label_top = cp_str if cp < 0 else '' %}{% set label_bot = cp_str if cp >= 0 else '' %}{% else %}{% set pct = 50 %}{% set label_top = '' %}{% set label_bot = '0.0' %}{% endif %}
                ha-card {
                  background: linear-gradient(to top, #f0f0f0 {{ pct }}%, #2b2b2b {{ pct }}%) !important;
                  border: 1px solid #444 !important;
                  border-radius: 4px !important;
                  height: 480px !important;
                  position: relative !important;
                  overflow: hidden !important;
                  box-shadow: none !important;
                }
                ha-card::before {
                  content: "{{ label_top }}";
                  position: absolute; top: 6px; left: 0; right: 0;
                  text-align: center; color: #f0f0f0;
                  font-family: monospace; font-size: 11px; font-weight: 700;
                }
                ha-card::after {
                  content: "{{ label_bot }}";
                  position: absolute; bottom: 6px; left: 0; right: 0;
                  text-align: center; color: #222;
                  font-family: monospace; font-size: 11px; font-weight: 700;
                }
                ha-markdown { display: none !important; }
          - type: picture-entity
            entity: image.phantom_YOUR_BOARD_MAC_board
            show_name: false
            show_state: false
            camera_view: auto
            card_mod:
              style: 'ha-card { border: 1px solid #444 !important; border-radius: 4px !important; overflow: hidden; }

                '
          - type: markdown
            card_mod:
              style: 'ha-card { background: #1f1f1f !important; border: 1px solid #333 !important; border-radius: 4px !important; padding: 0 !important; max-height: 480px; overflow: hidden; }

                ha-markdown { padding: 8px 10px !important; max-height: 480px; overflow-y: auto !important; scrollbar-width: thin; scrollbar-color: #555 #1f1f1f; }

                ha-markdown::-webkit-scrollbar { width: 6px; }

                ha-markdown::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

                ha-markdown p { margin: 0 !important; }

                ha-markdown table { width: 100%; border-collapse: collapse; }

                ha-markdown td { padding: 2px 4px; font-size: 12px; border-bottom: 1px solid #2a2a2a; }

                '
            content: '**Moves**


              {% set moves = state_attr(''sensor.phantom_YOUR_BOARD_MAC_move_history'', ''moves'') or [] %}{% if moves | length == 0 %}

              *No moves yet.*

              {% else %}

              | # | White | Black |

              |---:|:------|:------|

              {%- set num_pairs = (moves | length + 1) // 2 %}{%- for i in range(num_pairs) %}{%- set w = moves[i*2] if (i*2) < (moves | length) else none %}{%- set b = moves[i*2+1] if (i*2+1) < (moves
              | length) else none %}

              | {{ i+1 }} | {% if w %}{{ w.san }} <font color=''{{ w.color }}''>{{ w.glyph }}</font>{% endif %} | {% if b %}{{ b.san }} <font color=''{{ b.color }}''>{{
              b.glyph }}</font>{% endif %} |{%- endfor %}{% endif %}'
        - type: markdown
          card_mod:
            style: 'ha-card { background: #1a1a1a !important; border: 1px solid #333 !important; border-radius: 4px !important; padding: 0 !important; }

              ha-markdown { padding: 10px 14px !important; }

              ha-markdown p { margin: 0 !important; font-size: 13px; }

              '
          content: |-
            {% set mv = states('sensor.phantom_YOUR_BOARD_MAC_firmware_last_move') %}{% set cls = states('sensor.phantom_YOUR_BOARD_MAC_last_move_classification') %}{% set cpl = states('sensor.phantom_YOUR_BOARD_MAC_last_move_cpl') %}{% set motif = states('sensor.phantom_YOUR_BOARD_MAC_last_move_motif') %}{% set cp = states('sensor.phantom_YOUR_BOARD_MAC_eval_cp') %}{% set best = states('sensor.phantom_YOUR_BOARD_MAC_best_move_san') %}{% set src = states('sensor.phantom_YOUR_BOARD_MAC_eval_source') %}{% set color_map = {'brilliant':'#00bcd4','best':'#4caf50','good':'#8bc34a','book':'#795548','inaccuracy':'#ffc107','mistake':'#ff9800','blunder':'#f44336','unknown':'#9e9e9e'} %}{% set glyph_map = {'brilliant':'!!','best':'✓','good':'!','book':'📖','inaccuracy':'?!','mistake':'?','blunder':'??','unknown':'…'} %}{% set color = color_map.get(cls, '#9e9e9e') %}{% set glyph = glyph_map.get(cls, '…') %}{% if mv not in ['', 'unknown'] %}Last move: **{{ mv }}** {% if cls not in ['', 'unknown', 'unavailable'] %}&nbsp;&nbsp;<font color='{{ color }}'><b>{{ glyph }} {{ cls | title }}</b></font>{% endif %}{% if cpl not in ['', 'unknown', 'unavailable'] %}&nbsp;&nbsp;CPL: {{ cpl }}{% endif %}{% if motif not in ['', 'unknown', 'unavailable', 'none'] %}&nbsp;&nbsp;<font color='#80cbc4'>({{ motif | title }})</font>{% endif %}{% if cp not in ['', 'unknown', 'unavailable'] %}{% set cp_i = cp | int(0) %}&nbsp;&nbsp;Eval: **{{ '+' if cp_i >= 0 else '' }}{{ (cp_i/100.0) | round(1) }}**{% endif %}{% else %}*Waiting for first move…*{% endif %}  
            {% if is_state('input_boolean.phantom_chess_training_wheels', 'on') and best not in ['', 'unknown', 'unavailable'] %}<font color='#80cbc4'>💡 Engine recommends: **{{ best }}**</font>{% if src not in ['', 'unknown'] %} ({{ src }}){% endif %}{% endif %}
        - type: grid
