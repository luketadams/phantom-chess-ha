          - type: markdown
            content: "### Lichess \u2014 Level {{ states('select.phantom_YOUR_BOARD_MAC_ai_level') }}\n{% set op = states('sensor.phantom_YOUR_BOARD_MAC_opening_name') %}{% if op not in ['unknown',\
              \ 'unavailable', ''] %}*{{ op }}*  \n{% endif %}\u23F1 White **{{ states('sensor.phantom_YOUR_BOARD_MAC_lichess_white_clock_display') }}** \xB7 Black **{{ states('sensor.phantom_YOUR_BOARD_MAC_lichess_black_clock_display')\
              \ }}**"
        - type: conditional
