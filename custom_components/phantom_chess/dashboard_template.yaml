            icon: mdi:timer-sand
        - type: markdown
          content: "{% set d = states('number.phantom_YOUR_BOARD_MAC_ai_vs_ai_move_delay') | float(default=1.5) %}{% if d < 1 %}{% set pace = 'Frantic' %}{% elif d < 2 %}{% set pace = 'Brisk' %}{% elif d < 4 %}{% set pace = 'Watchable' %}{% else %}{% set pace = 'Leisurely' %}{% endif %}**{{ pace }}** \u2014 {{ d }}s per move. Lower = faster game but harder magnet timing; higher = easier to follow each move."
        - type: tile
          entity: binary_sensor.phantom_YOUR_BOARD_MAC_connected
          name: Start AI vs AI
          icon: mdi:play-circle
          color: pink
          vertical: true
          # Service handler reads coordinator.white_ai_level /
          # coordinator.black_ai_level / coordinator.ai_vs_ai_move_delay
