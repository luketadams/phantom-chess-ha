            , \"date\": \"1933.??.??\", \"site\": \"Princeton USA\", \"result\": \"1-0\", \"eco\": \"C70\", \"significance\": \"This game is notable for its association with two of the 20th century\u2019\
            s most famous physicists. Einstein, the developer of the theory of relativity, and Oppenheimer, the scientific director of the Manhattan Project, reportedly played this game at Princeton. The\
