            name: Resign
            icon: mdi:flag-outline
            hide_state: true
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.phantom_resign
              confirmation:
                text: Resign this game?
          - type: tile
            entity: input_boolean.phantom_chess_training_wheels
            name: Training wheels
            icon: mdi:school-outline
            tap_action:
              action: toggle
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_lichess_review_ready
        state: 'on'
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_lichess_active
        state: 'off'
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_connected
        state: 'on'
      card:
        type: vertical-stack
        cards:
        - type: grid
          columns: 2
          square: false
          cards:
          - type: tile
            entity: script.phantom_back_to_modes
            name: "\u2190 Back"
            icon: mdi:arrow-left
            hide_state: true
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.phantom_back_to_modes
          - type: markdown
            content: "### Game review\n{% set result = states('sensor.phantom_YOUR_BOARD_MAC_last_game_result') %}{% set wa = states('sensor.phantom_YOUR_BOARD_MAC_last_game_accuracy_white') %}{%\
              \ set ba = states('sensor.phantom_YOUR_BOARD_MAC_last_game_accuracy_black') %}Result: **{{ result if result not in ['', 'unknown'] else '\u2014' }}**  \nAccuracy \u2014 White {{ wa if wa\
              \ not in ['', 'unknown'] else '\u2014' }}% \xB7 Black {{ ba if ba not in ['', 'unknown'] else '\u2014' }}%"
        - type: markdown
          card_mod:
            style: 'ha-card { background: #1a1a1a !important; border: 1px solid #333 !important; border-radius: 4px !important; padding: 0 !important; }

              ha-markdown { padding: 12px 16px !important; }

              '
          content: "**Your three biggest mistakes**\n\n{% set mistakes = state_attr('sensor.phantom_YOUR_BOARD_MAC_last_game_review', 'top_mistakes') or [] %}{% if mistakes | length == 0 %}\n*No analysis\
            \ yet for this game.*\n{% else %}\n{% set color_map = {'inaccuracy':'#ffc107','mistake':'#ff9800','blunder':'#f44336'} %}{% for m in mistakes %}{% set c = color_map.get(m.classification, '#9e9e9e')\
            \ %}<div style='border-left: 3px solid {{ c }}; padding: 8px 12px; margin: 8px 0; background: #222;'><div style='font-weight:700; color: {{ c }};'>Move {{ m.move_num }}. {{ m.san }} \u2014 {{\
            \ m.classification | title }} <span style='opacity:0.7;font-size:12px;'>(lost {{ (m.cpl/100.0) | round(1) }} pawns)</span></div><div style='margin-top:4px;font-size:13px;'>Best was <b>{{ m.best_san\
            \ }}</b>{% if m.description %} \u2014 {{ m.description }}{% endif %}</div></div>{% endfor %}{% endif %}"
        - type: grid
          columns: 3
          square: false
          cards:
          - type: tile
            entity: input_select.phantom_chess_setup_mode
            name: New game
            icon: mdi:plus-circle-outline
            tap_action:
              action: call-service
              service: input_select.select_option
              target:
                entity_id: input_select.phantom_chess_setup_mode
              data:
                option: Play with Lichess
          - type: tile
            entity: script.phantom_back_to_modes
            name: Back to modes
            icon: mdi:arrow-left-circle
            hide_state: true
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.phantom_back_to_modes
          - type: tile
            entity: input_boolean.phantom_chess_training_wheels
            name: Training wheels
            icon: mdi:school-outline
            tap_action:
              action: toggle
