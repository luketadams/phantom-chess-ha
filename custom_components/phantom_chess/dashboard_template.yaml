# Phantom Chess Board — full-featured dashboard.
#
# Find/replace YOUR_BOARD_MAC → your board's MAC slug (lowercase, underscores).
# Find your slug by inspecting any phantom_chess entity_id, e.g.
# sensor.phantom_xx_xx_xx_xx_xx_xx_battery — the `xx_xx_xx_xx_xx_xx` part is your slug.
#
# Then in HA: Settings → Dashboards → + Add Dashboard → "New dashboard from scratch" →
# (after creating) Edit Dashboard → ⋮ menu → Raw configuration editor → paste this content.
#
# Requires (all installable via HACS → Frontend):
#  - custom:mushroom-template-card + custom:mushroom-chips-card ("Mushroom")
#  - custom:layout-card
#  - lovelace-card-mod
#
# Dashboard state machine (C3, 2026-07-06): which view renders is driven by
# integration-owned binary sensors, NOT copy-pasted firmware_mode string
# lists. `binary_sensor.<mac>_picker_available` is on when the board is
# connected, settled (idle ≥60s), in a home/standby firmware mode, and no
# game/review is running — it gates the mode picker and all per-mode setup
# views. The transient "magnet rearranging" states (Snapping/Calibrating/…)
# are owned by the stand-by interstitial cards on a disjoint firmware set, so
# exactly one view renders.

title: Phantom Chess
views:
- title: Phantom Chess
  path: main
  type: panel
  theme: Frosted Glass Dark Lite
  icon: mdi:chess-king
  badges: []
  cards:
  - type: vertical-stack
    cards:
    # Always-visible master mute for the spoken play-by-play (TTS). Works
    # in every mode and whether or not the board is connected (pure-local
    # config switch). Tap to toggle the voiceover on/off.
    - type: tile
      entity: switch.phantom_YOUR_BOARD_MAC_voice_announcements
      name: Voice announcements
      icon: mdi:account-voice
      color: blue
      tap_action:
        action: toggle
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_connected
        state: 'off'
      card:
        type: vertical-stack
        cards:
        - type: markdown
          content: '## Phantom board not connected


            Please turn on the Phantom board if you would like to play a game.


            The dashboard will update automatically once the board is powered on and connected via Bluetooth.'
        - type: tile
          entity: binary_sensor.phantom_YOUR_BOARD_MAC_connected
          name: Bluetooth connection
          icon: mdi:bluetooth-off
          color: grey
          hide_state: false
    # ── Mode picker (C3: collapsed to picker_available + setup_mode) ────────
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_picker_available
        state: 'on'
      - condition: state
        entity: input_select.phantom_chess_setup_mode
        state: Choose a mode
      card:
        type: vertical-stack
        cards:
        - type: grid
          columns: 2
          square: false
          cards:
          - type: markdown
            content: ' '
          - type: markdown
            content: "{% set conn = is_state('binary_sensor.phantom_YOUR_BOARD_MAC_connected', 'on') %}{% set mode = states('sensor.phantom_YOUR_BOARD_MAC_firmware_mode') %}{% set batt = states('sensor.phantom_YOUR_BOARD_MAC_battery')\
              \ %}{% set last = states('sensor.phantom_YOUR_BOARD_MAC_firmware_last_move') %}{{ '\U0001F7E2' if conn else '\U0001F534' }} &nbsp; Battery: **{{ batt }}%** &nbsp;•&nbsp; Mode: **{{\
              \ mode }}** &nbsp;•&nbsp; Last: `{{ last }}`"
        - type: markdown
          content: '## What would you like to do?

            Pick a mode. Each shows its own controls and explainer.'
        # NOTE: the mode-picker mascot picture buttons below are deliberately
        # left as-is (they are the product's branded launcher). Do not
        # restyle them into mushroom cards.
        - type: grid
          columns: 3
          square: false
          cards:
          - type: vertical-stack
            cards:
            - type: picture
              image: /local/phantom_chess/buttons/lichess.png?v=2
              tap_action:
                action: perform-action
                perform_action: input_select.select_option
                data:
                  entity_id: input_select.phantom_chess_setup_mode
                  option: Play with Lichess
              card_mod:
                style: 'ha-card { max-width: 340px; margin: 0 auto; border: none; background:
                  none; box-shadow: none; }

                  '
            - type: markdown
              content: Play with Lichess
              card_mod:
                style: 'ha-card { text-align: center; border: none; background: none; box-shadow:
                  none; padding: 4px 0 2px; font-weight: 500; font-size: 1.25em; }

                  '
          - type: vertical-stack
            cards:
            - type: picture
              image: /local/phantom_chess/buttons/stockfish.png
              tap_action:
                action: perform-action
                perform_action: input_select.select_option
                data:
                  entity_id: input_select.phantom_chess_setup_mode
                  option: Play with Stockfish
              card_mod:
                style: 'ha-card { max-width: 340px; margin: 0 auto; border: none; background:
                  none; box-shadow: none; }

                  '
            - type: markdown
              content: Play with Stockfish
              card_mod:
                style: 'ha-card { text-align: center; border: none; background: none; box-shadow:
                  none; padding: 4px 0 2px; font-weight: 500; font-size: 1.25em; }

                  '
          - type: vertical-stack
            cards:
            - type: picture
              image: /local/phantom_chess/buttons/historic.png
              tap_action:
                action: perform-action
                perform_action: input_select.select_option
                data:
                  entity_id: input_select.phantom_chess_setup_mode
                  option: Sculpture Library
              card_mod:
                style: 'ha-card { max-width: 340px; margin: 0 auto; border: none; background:
                  none; box-shadow: none; }

                  '
            - type: markdown
              content: Watch historic games
              card_mod:
                style: 'ha-card { text-align: center; border: none; background: none; box-shadow:
                  none; padding: 4px 0 2px; font-weight: 500; font-size: 1.25em; }

                  '
        - type: grid
          columns: 2
          square: false
          cards:
          - type: vertical-stack
            cards:
            - type: picture
              image: /local/phantom_chess/buttons/two_player.png
              tap_action:
                action: perform-action
                perform_action: input_select.select_option
                data:
                  entity_id: input_select.phantom_chess_setup_mode
                  option: 2-Player Game
              card_mod:
                style: 'ha-card { max-width: 340px; margin: 0 auto; border: none; background:
                  none; box-shadow: none; }

                  '
            - type: markdown
              content: Two-player recording
              card_mod:
                style: 'ha-card { text-align: center; border: none; background: none; box-shadow:
                  none; padding: 4px 0 2px; font-weight: 500; font-size: 1.25em; }

                  '
          - type: vertical-stack
            cards:
            - type: picture
              image: /local/phantom_chess/buttons/ai_vs_ai.png
              tap_action:
                action: perform-action
                perform_action: input_select.select_option
                data:
                  entity_id: input_select.phantom_chess_setup_mode
                  option: Watch AI vs AI
              card_mod:
                style: 'ha-card { max-width: 340px; margin: 0 auto; border: none; background:
                  none; box-shadow: none; }

                  '
            - type: markdown
              content: AI vs. AI
              card_mod:
                style: 'ha-card { text-align: center; border: none; background: none; box-shadow:
                  none; padding: 4px 0 2px; font-weight: 500; font-size: 1.25em; }

                  '
    # ── Lichess setup (C3 collapse + C7-dash compact buttons) ──────────────
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_picker_available
        state: 'on'
      - condition: state
        entity: input_select.phantom_chess_setup_mode
        state: Play with Lichess
      card:
        type: vertical-stack
        cards:
        - type: custom:mushroom-chips-card
          alignment: justify
          chips:
          - type: template
            icon: mdi:chevron-left
            content: Back to modes
            tap_action:
              action: perform-action
              perform_action: phantom_chess.back_to_modes
              data: {}
          - type: template
            icon: "{{ 'mdi:bluetooth-connect' if is_state('binary_sensor.phantom_YOUR_BOARD_MAC_connected', 'on') else 'mdi:bluetooth-off' }}"
            icon_color: "{{ 'green' if is_state('binary_sensor.phantom_YOUR_BOARD_MAC_connected', 'on') else 'red' }}"
            content: "{{ states('sensor.phantom_YOUR_BOARD_MAC_battery') }}% · {{ states('sensor.phantom_YOUR_BOARD_MAC_firmware_mode') }}"
        - type: markdown
          content: "## \U0001F310 Play with Lichess\nCreates a game against Lichess's Stockfish via the Board API. The game also appears in your Lichess account."
        - type: markdown
          content: '### Difficulty'
        - type: tile
          entity: select.phantom_YOUR_BOARD_MAC_ai_level
          name: AI level (1 = easiest, 8 = hardest)
          icon: mdi:robot
          color: amber
          features_position: bottom
          features:
          - type: select-options
        - type: markdown
          content: "{% set lvl = states('select.phantom_YOUR_BOARD_MAC_ai_level') | int(default=3) %}{% set elos = {1: '~400–800', 2: '~800–1100', 3: '~1100–1400', 4: '~1400–1700',\
            \ 5: '~1700–2000', 6: '~2000–2300', 7: '~2300–2700', 8: '~2800+ (full strength)'} %}**Currently selected: Level {{ lvl }} — approximately {{ elos.get(lvl, '?') }} ELO**\n\
            \n| Level | Approx. ELO |\n|:-:|:-:|\n| 1 | ~400–800 |\n| 2 | ~800–1100 |\n| 3 | ~1100–1400 |\n| 4 | ~1400–1700 |\n| 5 | ~1700–2000 |\n| 6 | ~2000–2300 |\n| 7 |\
            \ ~2300–2700 |\n| 8 | ~2800+ (full strength) |\n\n_Estimates from Lichess's official mapping. Local Stockfish uses the same Skill Level + depth table for consistency._"
        - type: markdown
          content: "### Time control\n{% set m = states('input_number.phantom_chess_lichess_clock_minutes') | int %}{% set i = states('input_number.phantom_chess_lichess_clock_increment') | int %}{% set\
            \ total = m * 60 + i * 40 %}{% if total < 180 %}{% set tclass = 'Bullet' %}{% elif total < 480 %}{% set tclass = 'Blitz' %}{% elif total < 1500 %}{% set tclass = 'Rapid' %}{% else %}{% set tclass\
            \ = 'Classical' %}{% endif %}**{{ tclass }}** — {{ m }} min + {{ i }} sec/move"
        - type: entities
          show_header_toggle: false
          entities:
          - entity: input_number.phantom_chess_lichess_clock_minutes
            name: Base time (minutes)
            icon: mdi:timer-outline
          - entity: input_number.phantom_chess_lichess_clock_increment
            name: Increment per move (seconds)
            icon: mdi:plus-circle-outline
        - type: markdown
          content: '### Game options'
        - type: tile
          entity: select.phantom_YOUR_BOARD_MAC_player_color
          name: My color
          icon: mdi:chess-pawn
          color: blue
          features_position: bottom
          features:
          - type: select-options
        - type: entities
          show_header_toggle: false
          entities:
          - entity: number.phantom_YOUR_BOARD_MAC_mechanism_speed
            name: Mechanism speed
            icon: mdi:speedometer
          - entity: number.phantom_YOUR_BOARD_MAC_sound_level
            name: Sound level
            icon: mdi:volume-high
        # PRIMARY action — one slim full-width CTA (C7-dash).
        - type: custom:mushroom-template-card
          primary: Start Lichess game
          icon: mdi:play-circle
          icon_color: purple
          layout: horizontal
          fill_container: true
          tap_action:
            action: perform-action
            perform_action: phantom_chess.start_lichess_configured
            data: {}
          card_mod:
            style: |
              ha-card { min-height: 56px; }
    # ── Stockfish setup (C3 collapse + C7-dash compact buttons) ────────────
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_picker_available
        state: 'on'
      - condition: state
        entity: input_select.phantom_chess_setup_mode
        state: Play with Stockfish
      card:
        type: vertical-stack
        cards:
        - type: custom:mushroom-chips-card
          alignment: justify
          chips:
          - type: template
            icon: mdi:chevron-left
            content: Back to modes
            tap_action:
              action: perform-action
              perform_action: phantom_chess.back_to_modes
              data: {}
          - type: template
            icon: "{{ 'mdi:bluetooth-connect' if is_state('binary_sensor.phantom_YOUR_BOARD_MAC_connected', 'on') else 'mdi:bluetooth-off' }}"
            icon_color: "{{ 'green' if is_state('binary_sensor.phantom_YOUR_BOARD_MAC_connected', 'on') else 'red' }}"
            content: "{{ states('sensor.phantom_YOUR_BOARD_MAC_battery') }}% · {{ states('sensor.phantom_YOUR_BOARD_MAC_firmware_mode') }}"
        - type: markdown
          content: "## \U0001F916 Play with Stockfish (local)\nPlays against a Stockfish engine running on this Home Assistant host — no internet required. Skill level uses the AI Level setting below."
        - type: markdown
          content: '### Options'
        - type: tile
          entity: select.phantom_YOUR_BOARD_MAC_player_color
          name: My color
          icon: mdi:chess-pawn
          color: blue
          features_position: bottom
          features:
          - type: select-options
        - type: tile
          entity: select.phantom_YOUR_BOARD_MAC_ai_level
          name: AI level
          icon: mdi:robot
          color: amber
          features_position: bottom
          features:
          - type: select-options
        - type: markdown
          content: "{% set lvl = states('select.phantom_YOUR_BOARD_MAC_ai_level') | int(default=3) %}{% set elos = {1: '~400–800', 2: '~800–1100', 3: '~1100–1400', 4: '~1400–1700',\
            \ 5: '~1700–2000', 6: '~2000–2300', 7: '~2300–2700', 8: '~2800+ (full strength)'} %}**Currently selected: Level {{ lvl }} — approximately {{ elos.get(lvl, '?') }} ELO**\n\
            \n| Level | Approx. ELO |\n|:-:|:-:|\n| 1 | ~400–800 |\n| 2 | ~800–1100 |\n| 3 | ~1100–1400 |\n| 4 | ~1400–1700 |\n| 5 | ~1700–2000 |\n| 6 | ~2000–2300 |\n| 7 |\
            \ ~2300–2700 |\n| 8 | ~2800+ (full strength) |\n\n_Estimates from Lichess's official mapping. Local Stockfish uses the same Skill Level + depth table for consistency._"
        - type: entities
          show_header_toggle: false
          entities:
          - entity: number.phantom_YOUR_BOARD_MAC_mechanism_speed
            name: Mechanism speed
            icon: mdi:speedometer
          - entity: number.phantom_YOUR_BOARD_MAC_sound_level
            name: Sound level
            icon: mdi:volume-high
        # PRIMARY action — one slim full-width CTA (C7-dash).
        - type: custom:mushroom-template-card
          primary: Start game vs Stockfish
          icon: mdi:play-circle
          icon_color: blue
          layout: horizontal
          fill_container: true
          tap_action:
            action: perform-action
            perform_action: phantom_chess.start_local_game
            data: {}
          card_mod:
            style: |
              ha-card { min-height: 56px; }
    # ── Sculpture Library setup (C3 collapse + C4 attrs + C7-dash) ──────────
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_picker_available
        state: 'on'
      - condition: state
        entity: input_select.phantom_chess_setup_mode
        state: Sculpture Library
      # Hide the setup card while a game is actively being driven (the
      # sculpture-playback view below owns that state).
      - condition: not
        conditions:
        - condition: state
          entity: sensor.phantom_YOUR_BOARD_MAC_lichess_game_id
          state: sculpture
      card:
        type: vertical-stack
        cards:
        - type: custom:mushroom-chips-card
          alignment: justify
          chips:
          - type: template
            icon: mdi:chevron-left
            content: Back to modes
            tap_action:
              action: perform-action
              perform_action: phantom_chess.back_to_modes
              data: {}
          - type: template
            icon: "{{ 'mdi:bluetooth-connect' if is_state('binary_sensor.phantom_YOUR_BOARD_MAC_connected', 'on') else 'mdi:bluetooth-off' }}"
            icon_color: "{{ 'green' if is_state('binary_sensor.phantom_YOUR_BOARD_MAC_connected', 'on') else 'red' }}"
            content: "{{ states('sensor.phantom_YOUR_BOARD_MAC_battery') }}% · {{ states('sensor.phantom_YOUR_BOARD_MAC_firmware_mode') }}"
        - type: markdown
          content: "## \U0001F3DB Historic Games\nChoose a historic chess game; the board plays it out before your eyes."
        - type: tile
          entity: input_select.phantom_chess_sculpture_game
          name: Choose a game
          icon: mdi:chess-king
          color: purple
          features_position: bottom
          features:
          - type: select-options
        # C4: rendered straight from the sculpture-select's attributes
        # (sourced from sculpture_games.json). The old 55-line inline Jinja
        # dict — which had to be hand-synced with the JSON and was already
        # drifting — is deleted. The per-game <img> was dropped: the images
        # were never bundled/provisioned, so every card showed a broken
        # image on a fresh install.
        - type: markdown
          content: "{% set e = 'select.phantom_YOUR_BOARD_MAC_sculpture_game' %}{% set choice = states(e) %}### {{ choice }}\n\n**White:** {{ state_attr(e, 'white') or '?' }}  |  **Black:** {{ state_attr(e, 'black') or '?' }}\n\n**Date:** {{ state_attr(e, 'date') or '?' }}  |  **Result:** {{ state_attr(e, 'result') or '?' }}  |  **ECO:** {{ state_attr(e, 'eco') or '?' }}\n\n**Site:** {{ state_attr(e, 'site') or '?' }}\n\n> {{ state_attr(e, 'significance') or '' }}"
        # PRIMARY action — one slim full-width CTA (C7-dash).
        - type: custom:mushroom-template-card
          primary: Play selected game
          icon: mdi:motion-play-outline
          icon_color: purple
          layout: horizontal
          fill_container: true
          tap_action:
            action: perform-action
            perform_action: phantom_chess.play_selected_sculpture
            data: {}
          card_mod:
            style: |
              ha-card { min-height: 56px; }
    # beta3: sculpture-playback view. The integration now DRIVES the selected
    # historic game move-by-move (chess-play mode), so we gate on its own
    # reliable signal — sensor.<mac>_lichess_game_id == "sculpture" — rather
    # than the fragile firmware_mode strings (which cycle Setting Up / Snapping
    # Pieces / Board Playing during playback). Hidden once the post-game review
    # is ready, so the review view takes over cleanly.
    - type: conditional
      conditions:
      - condition: state
        entity: input_select.phantom_chess_setup_mode
        state: Sculpture Library
      - condition: state
        entity: sensor.phantom_YOUR_BOARD_MAC_lichess_game_id
        state: sculpture
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_lichess_review_ready
        state: 'off'
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_connected
        state: 'on'
      card:
        type: vertical-stack
        cards:
        - type: custom:mushroom-chips-card
          alignment: justify
          chips:
          - type: template
            icon: mdi:stop
            content: Stop & back to modes
            tap_action:
              action: perform-action
              perform_action: phantom_chess.back_to_modes
              data: {}
          - type: template
            icon: mdi:motion-play-outline
            icon_color: purple
            content: "▶ {{ states('select.phantom_YOUR_BOARD_MAC_sculpture_game') }}"
        - type: picture-entity
          entity: image.phantom_YOUR_BOARD_MAC_board
          show_state: false
          show_name: false
          camera_view: auto
          tap_action:
            action: none
          hold_action:
            action: none
        - type: markdown
          content: "{% set w = states('sensor.phantom_YOUR_BOARD_MAC_lichess_white_name')\
            \ %}{% set b = states('sensor.phantom_YOUR_BOARD_MAC_lichess_black_name') %}{%\
            \ set n = states('sensor.phantom_YOUR_BOARD_MAC_move_history') %}{% set last =\
            \ states('sensor.phantom_YOUR_BOARD_MAC_firmware_last_move') %}**{{ w }}** vs\
            \ **{{ b }}**\n\nMove **{{ n }}** &nbsp;•&nbsp; Last: `{{ last }}`\n\nThe board\
            \ is playing this game out move-by-move — sit back and watch. Tap **Stop & back\
            \ to modes** to end it early."
    # ── Two-player recording setup (C3 collapse + C7-dash) ─────────────────
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_picker_available
        state: 'on'
      - condition: state
        entity: input_select.phantom_chess_setup_mode
        state: 2-Player Game
      card:
        type: vertical-stack
        cards:
        - type: custom:mushroom-chips-card
          alignment: justify
          chips:
          - type: template
            icon: mdi:chevron-left
            content: Back to modes
            tap_action:
              action: perform-action
              perform_action: phantom_chess.back_to_modes
              data: {}
          - type: template
            icon: "{{ 'mdi:bluetooth-connect' if is_state('binary_sensor.phantom_YOUR_BOARD_MAC_connected', 'on') else 'mdi:bluetooth-off' }}"
            icon_color: "{{ 'green' if is_state('binary_sensor.phantom_YOUR_BOARD_MAC_connected', 'on') else 'red' }}"
            content: "{{ states('sensor.phantom_YOUR_BOARD_MAC_battery') }}% · {{ states('sensor.phantom_YOUR_BOARD_MAC_firmware_mode') }}"
        - type: markdown
          content: "## \U0001F465 Two-Player Recording\nSet up the pieces, press **Start recording**, and play — both sides are human. Every move is tracked live with Stockfish evaluation, the strength meter on the left, move classification and full history. Turn on **Training wheels** for visual and spoken coaching. The game is saved as a PGN when it ends; press the board’s Reset button to end early."
        # PRIMARY action — one slim full-width CTA (C7-dash).
        - type: custom:mushroom-template-card
          primary: Start recording
          icon: mdi:record-circle
          icon_color: green
          layout: horizontal
          fill_container: true
          tap_action:
            action: perform-action
            perform_action: phantom_chess.start_two_player_game
            data: {}
          card_mod:
            style: |
              ha-card { min-height: 56px; }
        # SECONDARY actions — compact mushroom grid (C7-dash).
        - type: grid
          columns: 2
          square: false
          cards:
          - type: custom:mushroom-template-card
            primary: Training wheels
            icon: mdi:school
            icon_color: "{{ 'amber' if is_state('input_boolean.phantom_chess_training_wheels', 'on') else 'grey' }}"
            entity: input_boolean.phantom_chess_training_wheels
            tap_action:
              action: toggle
            card_mod:
              style: |
                ha-card { min-height: 56px; }
          # v0.4-beta2: one-tap recovery when an illegal physical move
          # has knocked the board model out of sync with the pieces.
          # Re-drives the pieces back to the last recorded position.
          - type: custom:mushroom-template-card
            primary: Resync board
            icon: mdi:sync-alert
            icon_color: orange
            tap_action:
              action: perform-action
              perform_action: phantom_chess.resync_two_player
              data: {}
            card_mod:
              style: |
                ha-card { min-height: 56px; }
    # v0.4-alpha30: Watch AI vs AI section. Stockfish plays both sides on the
    # physical board so the user can watch as a spectator. Three
    # integration-owned sliders configure the levels + pacing
    # (number.*_white_ai_level, _black_ai_level, _ai_vs_ai_move_delay).
    # (C3 collapse + C7-dash.)
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_picker_available
        state: 'on'
      - condition: state
        entity: input_select.phantom_chess_setup_mode
        state: Watch AI vs AI
      card:
        type: vertical-stack
        cards:
        - type: custom:mushroom-chips-card
          alignment: justify
          chips:
          - type: template
            icon: mdi:chevron-left
            content: Back to modes
            tap_action:
              action: perform-action
              perform_action: phantom_chess.back_to_modes
              data: {}
          - type: template
            icon: "{{ 'mdi:bluetooth-connect' if is_state('binary_sensor.phantom_YOUR_BOARD_MAC_connected', 'on') else 'mdi:bluetooth-off' }}"
            icon_color: "{{ 'green' if is_state('binary_sensor.phantom_YOUR_BOARD_MAC_connected', 'on') else 'red' }}"
