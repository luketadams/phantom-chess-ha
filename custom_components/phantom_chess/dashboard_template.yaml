          square: false
          cards:
          - type: vertical-stack
            cards:
            - type: picture
              image: /local/phantom_chess/buttons/two_player.png
              tap_action:
                action: perform-action
                perform_action: input_select.select_option
                data:
                  entity_id: input_select.phantom_chess_setup_mode
                  option: 2-Player Game
              card_mod:
                style: 'ha-card { max-width: 340px; margin: 0 auto; border: none; background:
                  none; box-shadow: none; }

                  '
            - type: markdown
              content: Two-player recording
              card_mod:
                style: 'ha-card { text-align: center; border: none; background: none; box-shadow:
                  none; padding: 4px 0 2px; font-weight: 500; font-size: 1.25em; }

                  '
          - type: vertical-stack
            cards:
            - type: picture
              image: /local/phantom_chess/buttons/ai_vs_ai.png
              tap_action:
                action: perform-action
                perform_action: input_select.select_option
