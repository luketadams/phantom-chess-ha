        entity: binary_sensor.phantom_YOUR_BOARD_MAC_lichess_review_ready
        state: 'off'
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_connected
        state: 'on'
      - condition: state
        entity: binary_sensor.phantom_chess_board_idle
        state: 'on'
      card:
        type: vertical-stack
        cards:
        - type: grid
          columns: 2
          square: false
          cards:
          - type: tile
            entity: script.phantom_back_to_modes
            name: Back to modes
            icon: mdi:chevron-left
            color: grey
          - type: markdown
            content: "{% set conn = is_state('binary_sensor.phantom_YOUR_BOARD_MAC_connected', 'on') %}{% set mode = states('sensor.phantom_YOUR_BOARD_MAC_firmware_mode') %}{% set batt = states('sensor.phantom_YOUR_BOARD_MAC_battery')\
              \ %}{% set last = states('sensor.phantom_YOUR_BOARD_MAC_firmware_last_move') %}{{ '\U0001F7E2' if conn else '\U0001F534' }} &nbsp; Battery: **{{ batt }}%** &nbsp;\u2022&nbsp; Mode: **{{\
              \ mode }}** &nbsp;\u2022&nbsp; Last: `{{ last }}`"
        - type: markdown
          content: "## \U0001F916 Watch AI vs AI\nStockfish plays both sides on the physical board. Configure each side's skill level and the pacing between moves, then press Start. Place pieces in the starting position before launching."
        - type: markdown
          content: '### Levels'
        - type: entities
          show_header_toggle: false
          entities:
          - entity: number.phantom_YOUR_BOARD_MAC_white_ai_level
            name: White Stockfish level (1\u20138)
            icon: mdi:chess-king
          - entity: number.phantom_YOUR_BOARD_MAC_black_ai_level
            name: Black Stockfish level (1\u20138)
            icon: mdi:chess-king
        - type: markdown
          content: "{% set w = states('number.phantom_YOUR_BOARD_MAC_white_ai_level') | int(default=3) %}{% set b = states('number.phantom_YOUR_BOARD_MAC_black_ai_level') | int(default=3) %}{% set elos = {1: '~400\u2013800', 2: '~800\u20131100', 3: '~1100\u20131400', 4: '~1400\u20131700', 5: '~1700\u20132000', 6: '~2000\u20132300', 7: '~2300\u20132700', 8: '~2800+ (full strength)'} %}\u26aa **White**: Level {{ w }} \u2014 ~{{ elos.get(w, '?') }} ELO\n\u26ab **Black**: Level {{ b }} \u2014 ~{{ elos.get(b, '?') }} ELO\n\n_Lower levels make more mistakes (more dramatic games). Equal levels yield closer games; large gaps usually favor the higher-rated side._"
        - type: markdown
          content: '### Pacing'
