# Phantom Chess Board — full-featured dashboard.
#
# Find/replace YOUR_BOARD_MAC → your board's MAC slug (lowercase, underscores).
# Find your slug by inspecting any phantom_chess entity_id, e.g.
# sensor.phantom_xx_xx_xx_xx_xx_xx_battery — the `xx_xx_xx_xx_xx_xx` part is your slug.
#
# Then in HA: Settings → Dashboards → + Add Dashboard → "New dashboard from scratch" →
# (after creating) Edit Dashboard → ⋮ menu → Raw configuration editor → paste this content.
#
# Requires:
#  - HACS frontend: custom:mushroom-template-card ("Mushroom")
#  - HACS frontend: custom:layout-card
#  - All helpers from `helpers.yaml` in this folder
#  - All scripts from `scripts.yaml` in this folder

title: Chess
views:
- title: Chess
  path: main
  type: panel
  theme: Frosted Glass Dark Lite
  icon: mdi:chess-king
  badges: []
  cards:
  - type: vertical-stack
    cards:
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_connected
        state: 'off'
      card:
        type: vertical-stack
        cards:
        - type: markdown
          content: '## Phantom board not connected


            Please turn on the Phantom board if you would like to play a game.


            The dashboard will update automatically once the board is powered on and connected via Bluetooth.'
        - type: tile
          entity: binary_sensor.phantom_YOUR_BOARD_MAC_connected
          name: Bluetooth connection
          icon: mdi:bluetooth-off
          color: grey
          hide_state: false
    - type: conditional
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.phantom_YOUR_BOARD_MAC_firmware_mode
          state: HOME
        - condition: state
          entity: sensor.phantom_YOUR_BOARD_MAC_firmware_mode
          state: Waiting Side
        - condition: state
          entity: sensor.phantom_YOUR_BOARD_MAC_firmware_mode
          state: unknown
        - condition: state
          entity: sensor.phantom_YOUR_BOARD_MAC_firmware_mode
          state: unavailable
        - condition: state
          entity: sensor.phantom_YOUR_BOARD_MAC_firmware_mode
          state: BLE Playing
      - condition: state
        entity: input_select.phantom_chess_setup_mode
        state: Choose a mode
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_lichess_active
        state: 'off'
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_lichess_review_ready
        state: 'off'
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_connected
        state: 'on'
      - condition: state
        entity: binary_sensor.phantom_chess_board_idle
        state: 'on'
      card:
        type: vertical-stack
        cards:
        - type: grid
          columns: 2
          square: false
          cards:
          - type: markdown
            content: ' '
          - type: markdown
            content: "{% set conn = is_state('binary_sensor.phantom_YOUR_BOARD_MAC_connected', 'on') %}{% set mode = states('sensor.phantom_YOUR_BOARD_MAC_firmware_mode') %}{% set batt = states('sensor.phantom_YOUR_BOARD_MAC_battery')\
              \ %}{% set last = states('sensor.phantom_YOUR_BOARD_MAC_firmware_last_move') %}{{ '\U0001F7E2' if conn else '\U0001F534' }} &nbsp; Battery: **{{ batt }}%** &nbsp;\u2022&nbsp; Mode: **{{\
              \ mode }}** &nbsp;\u2022&nbsp; Last: `{{ last }}`"
        - type: markdown
          content: '## What would you like to do?

            Pick a mode. Each shows its own controls and explainer.'
        - type: grid
          columns: 2
          square: false
          cards:
          - type: tile
            entity: input_select.phantom_chess_setup_mode
            name: Play with Lichess
            icon: mdi:web
            color: purple
            vertical: true
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              data:
                entity_id: input_select.phantom_chess_setup_mode
                option: Play with Lichess
          - type: tile
            entity: input_select.phantom_chess_setup_mode
            name: Play with Stockfish
            icon: mdi:chip
            color: blue
            vertical: true
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              data:
                entity_id: input_select.phantom_chess_setup_mode
                option: Play with Stockfish
          - type: tile
            entity: input_select.phantom_chess_setup_mode
            name: Sculpture Library
            icon: mdi:auto-fix
            color: amber
            vertical: true
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              data:
                entity_id: input_select.phantom_chess_setup_mode
                option: Sculpture Library
          - type: tile
            entity: input_select.phantom_chess_setup_mode
            name: 2-Player Game
            icon: mdi:account-multiple
            color: green
            vertical: true
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              data:
                entity_id: input_select.phantom_chess_setup_mode
                option: 2-Player Game
    - type: conditional
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.phantom_YOUR_BOARD_MAC_firmware_mode
          state: HOME
        - condition: state
          entity: sensor.phantom_YOUR_BOARD_MAC_firmware_mode
          state: Waiting Side
        - condition: state
          entity: sensor.phantom_YOUR_BOARD_MAC_firmware_mode
          state: unknown
        - condition: state
          entity: sensor.phantom_YOUR_BOARD_MAC_firmware_mode
          state: unavailable
        - condition: state
          entity: sensor.phantom_YOUR_BOARD_MAC_firmware_mode
          state: BLE Playing
      - condition: state
        entity: input_select.phantom_chess_setup_mode
        state: Play with Lichess
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_lichess_active
        state: 'off'
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_lichess_review_ready
        state: 'off'
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_connected
        state: 'on'
      - condition: state
        entity: binary_sensor.phantom_chess_board_idle
        state: 'on'
      card:
        type: vertical-stack
        cards:
        - type: grid
          columns: 2
          square: false
          cards:
          - type: tile
            entity: script.phantom_back_to_modes
            name: Back to modes
            icon: mdi:chevron-left
            color: grey
          - type: markdown
            content: "{% set conn = is_state('binary_sensor.phantom_YOUR_BOARD_MAC_connected', 'on') %}{% set mode = states('sensor.phantom_YOUR_BOARD_MAC_firmware_mode') %}{% set batt = states('sensor.phantom_YOUR_BOARD_MAC_battery')\
              \ %}{% set last = states('sensor.phantom_YOUR_BOARD_MAC_firmware_last_move') %}{{ '\U0001F7E2' if conn else '\U0001F534' }} &nbsp; Battery: **{{ batt }}%** &nbsp;\u2022&nbsp; Mode: **{{\
              \ mode }}** &nbsp;\u2022&nbsp; Last: `{{ last }}`"
        - type: markdown
          content: "## \U0001F310 Play with Lichess\nCreates a game against Lichess's Stockfish via the Board API. The game also appears in your Lichess account."
        - type: markdown
          content: '### Difficulty'
        - type: tile
          entity: select.phantom_YOUR_BOARD_MAC_ai_level
          name: AI level (1 = easiest, 8 = hardest)
          icon: mdi:robot
          color: amber
          features_position: bottom
          features:
          - type: select-options
        - type: markdown
          content: "{% set lvl = states('select.phantom_YOUR_BOARD_MAC_ai_level') | int(default=3) %}{% set elos = {1: '~400\u2013800', 2: '~800\u20131100', 3: '~1100\u20131400', 4: '~1400\u20131700',\
            \ 5: '~1700\u20132000', 6: '~2000\u20132300', 7: '~2300\u20132700', 8: '~2800+ (full strength)'} %}**Currently selected: Level {{ lvl }} \u2014 approximately {{ elos.get(lvl, '?') }} ELO**\n\
            \n| Level | Approx. ELO |\n|:-:|:-:|\n| 1 | ~400\u2013800 |\n| 2 | ~800\u20131100 |\n| 3 | ~1100\u20131400 |\n| 4 | ~1400\u20131700 |\n| 5 | ~1700\u20132000 |\n| 6 | ~2000\u20132300 |\n| 7 |\
            \ ~2300\u20132700 |\n| 8 | ~2800+ (full strength) |\n\n_Estimates from Lichess's official mapping. Local Stockfish uses the same Skill Level + depth table for consistency._"
        - type: markdown
          content: "### Time control\n{% set m = states('input_number.phantom_chess_lichess_clock_minutes') | int %}{% set i = states('input_number.phantom_chess_lichess_clock_increment') | int %}{% set\
            \ total = m * 60 + i * 40 %}{% if total < 180 %}{% set tclass = 'Bullet' %}{% elif total < 480 %}{% set tclass = 'Blitz' %}{% elif total < 1500 %}{% set tclass = 'Rapid' %}{% else %}{% set tclass\
            \ = 'Classical' %}{% endif %}**{{ tclass }}** \u2014 {{ m }} min + {{ i }} sec/move"
        - type: entities
          show_header_toggle: false
          entities:
          - entity: input_number.phantom_chess_lichess_clock_minutes
            name: Base time (minutes)
            icon: mdi:timer-outline
          - entity: input_number.phantom_chess_lichess_clock_increment
            name: Increment per move (seconds)
            icon: mdi:plus-circle-outline
        - type: markdown
          content: '### Game options'
        - type: tile
          entity: select.phantom_YOUR_BOARD_MAC_player_color
          name: My color
          icon: mdi:chess-pawn
          color: blue
          features_position: bottom
          features:
          - type: select-options
        - type: entities
          show_header_toggle: false
          entities:
          - entity: number.phantom_YOUR_BOARD_MAC_mechanism_speed
            name: Mechanism speed
            icon: mdi:speedometer
          - entity: number.phantom_YOUR_BOARD_MAC_sound_level
            name: Sound level
            icon: mdi:volume-high
        - type: tile
          entity: script.phantom_start_lichess_configured
          name: Start Lichess game
          icon: mdi:play-circle
          color: purple
          vertical: true
          tap_action:
            action: perform-action
            perform_action: script.turn_on
            data:
              entity_id: script.phantom_start_lichess_configured
