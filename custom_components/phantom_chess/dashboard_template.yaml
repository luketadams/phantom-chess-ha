            }, \"2013 \u2014 Aronian vs Anand (Anand's Immortal)\": {\"white\": \"Levon Aronian\", \"black\": \"Viswanathan Anand\", \"date\": \"2013.01.15\", \"site\": \"Wijk aan Zee NED\", \"result\"\
