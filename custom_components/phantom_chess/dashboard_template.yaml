            : \"Richard Reti\", \"black\": \"Jose Raul Capablanca\", \"date\": \"1924.03.22\", \"site\": \"New York, NY USA\", \"result\": \"1-0\", \"eco\": \"A15\", \"significance\": \"Capablanca, one\
            \ of the greatest positional players, dismantled R\xE9ti\u2019s hypermodern opening (R\xE9ti Opening) with precise play. This game highlighted the clash between classical and hypermodern chess\
