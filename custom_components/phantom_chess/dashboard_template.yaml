          - type: template
            icon: "{{ 'mdi:bluetooth-connect' if is_state('binary_sensor.phantom_YOUR_BOARD_MAC_connected', 'on') else 'mdi:bluetooth-off' }}"
            icon_color: "{{ 'green' if is_state('binary_sensor.phantom_YOUR_BOARD_MAC_connected', 'on') else 'red' }}"
            content: "{{ states('sensor.phantom_YOUR_BOARD_MAC_battery') }}% · {{ states('sensor.phantom_YOUR_BOARD_MAC_firmware_mode') }}"
        # C5: mode-aware header. The old card hardcoded "### Lichess — Level N"
        # and always rendered the Lichess clocks, which read `unknown` in
        # local Stockfish / AI-vs-AI / two-player. Branch on setup_mode.
        - type: markdown
          content: >-
            {% set sm = states('select.phantom_YOUR_BOARD_MAC_setup_mode') %}{% set lvl = states('select.phantom_YOUR_BOARD_MAC_ai_level') %}{% set wl = states('number.phantom_YOUR_BOARD_MAC_white_ai_level') %}{% set bl = states('number.phantom_YOUR_BOARD_MAC_black_ai_level') %}{% if sm == 'Play with Lichess' %}### 🌐 Lichess — Level {{ lvl }}{% elif sm == 'Play with Stockfish' %}### 🤖 Stockfish — Level {{ lvl }}{% elif sm == 'Watch AI vs AI' %}### 🤖 AI vs AI — White L{{ wl }} · Black L{{ bl }}{% elif sm == '2-Player Game' %}### 👥 Two-player recording{% else %}### ♟ Game{% endif %}

            {% set op = states('sensor.phantom_YOUR_BOARD_MAC_opening_name') %}{% if op not in ['unknown', 'unavailable', ''] %}*{{ op }}*  {% endif %}{% if sm == 'Play with Lichess' %}⏱ White **{{ states('sensor.phantom_YOUR_BOARD_MAC_lichess_white_clock_display') }}** · Black **{{ states('sensor.phantom_YOUR_BOARD_MAC_lichess_black_clock_display') }}**{% endif %}
        # Live-fix 2026-07-08: conditional cards don't support template
        # conditions (only state/numeric_state/and/or/not) — the wrapper
        # rendered a permanent "Configuration error" card. The banner is now
        # a plain markdown card that hides itself via card_mod when there is
        # no threat (same pattern as the eval bar's template-driven style).
        - type: markdown
          card_mod:
            style: '{% if states(''sensor.phantom_YOUR_BOARD_MAC_threat_san'') in ['''', ''unknown'', ''unavailable'', ''none''] %}ha-card { display: none !important; }{% endif %}

              ha-card { background: rgba(255, 208, 84, 0.14) !important; border-left: 3px solid var(--warning-color, #ffd054) !important; border-radius: 6px !important; padding: 0 !important; }

              ha-markdown { padding: 8px 12px !important; }

              ha-markdown p { margin: 0 !important; color: var(--warning-color, #ffd054) !important; }

              '
          # C5: name the side to move (was hardcoded "Black threatens").
          content: "{% set stm = state_attr('sensor.phantom_YOUR_BOARD_MAC_live_position', 'side_to_move') %}⚠ {{ (stm | title) if stm in ['white', 'black'] else 'Opponent' }} threatens **{{ states('sensor.phantom_YOUR_BOARD_MAC_threat_san') }}** next move"
        - type: custom:layout-card
          layout_type: grid
          layout:
            grid-template-columns: 48px 1fr 280px
            grid-gap: 10px
            grid-template-rows: auto
          cards:
          # Vertical eval bar - drawn with card-mod CSS (gradient fill + ::before/::after
          # labels) instead of inline-HTML <div>s. HA's markdown card sanitizes its body
          # with js-xss, whose whitelist allows <div>/<span> as tags but with no
          # attributes - so inline style= is stripped and an inline-HTML bar renders
          # blank. card-mod CSS is injected into the shadow DOM and bypasses that
          # sanitizer. pct + labels are computed by a Jinja template in the style,
          # re-evaluated whenever eval_cp / eval_mate change; the markdown body is hidden.
          #
          # C5: oriented by player color. When the human plays black the board
          # image is flipped (black at the bottom), so the eval bar flips too —
          # the side-to-bottom's advantage fills from the bottom. The #f0f0f0 /
          # #2b2b2b gradient stops are the chess side colors (white / black),
          # not theme chrome, so they stay literal.
          - type: markdown
            content: ' '
            card_mod:
              style: |
                {% set cp_raw = states('sensor.phantom_YOUR_BOARD_MAC_eval_cp') %}{% set mate_raw = states('sensor.phantom_YOUR_BOARD_MAC_eval_mate') %}{% set has_mate = mate_raw not in ['', 'unknown', 'unavailable'] %}{% set has_cp = cp_raw not in ['', 'unknown', 'unavailable'] %}{% if has_mate %}{% set mate = mate_raw | int %}{% set pct = 98 if mate > 0 else 2 %}{% set label_top = 'M' + (mate|abs|string) if mate < 0 else '' %}{% set label_bot = 'M' + (mate|abs|string) if mate >= 0 else '' %}{% elif has_cp %}{% set cp = cp_raw | int %}{% set pct = ((cp / 4.0) + 50) | round(0) | int %}{% if pct < 3 %}{% set pct = 3 %}{% elif pct > 97 %}{% set pct = 97 %}{% endif %}{% set cp_str = ('+' if cp >= 0 else '') + ((cp/100.0) | round(1) | string) %}{% set label_top = cp_str if cp < 0 else '' %}{% set label_bot = cp_str if cp >= 0 else '' %}{% else %}{% set pct = 50 %}{% set label_top = '' %}{% set label_bot = '0.0' %}{% endif %}{% if state_attr('sensor.phantom_YOUR_BOARD_MAC_live_position', 'our_color') == 'black' %}{% set pct = 100 - pct %}{% set label_top, label_bot = label_bot, label_top %}{% endif %}
                ha-card {
                  background: linear-gradient(to top, #f0f0f0 {{ pct }}%, #2b2b2b {{ pct }}%) !important;
                  border: 1px solid var(--divider-color, #444) !important;
                  border-radius: 4px !important;
                  height: 480px !important;
                  position: relative !important;
                  overflow: hidden !important;
                  box-shadow: none !important;
                }
                ha-card::before {
                  content: "{{ label_top }}";
                  position: absolute; top: 6px; left: 0; right: 0;
                  text-align: center; color: #f0f0f0;
                  font-family: monospace; font-size: 11px; font-weight: 700;
                }
                ha-card::after {
                  content: "{{ label_bot }}";
                  position: absolute; bottom: 6px; left: 0; right: 0;
                  text-align: center; color: #222;
                  font-family: monospace; font-size: 11px; font-weight: 700;
                }
                ha-markdown { display: none !important; }
          - type: picture-entity
            entity: image.phantom_YOUR_BOARD_MAC_board
            show_name: false
            show_state: false
            camera_view: auto
            card_mod:
              style: 'ha-card { border: 1px solid var(--divider-color, #444) !important; border-radius: 4px !important; overflow: hidden; }

                '
          - type: markdown
            card_mod:
              style: 'ha-card { background: var(--card-background-color, #1f1f1f) !important; border: 1px solid var(--divider-color, #333) !important; border-radius: 4px !important; padding: 0 !important; max-height: 480px; overflow: hidden; }

                ha-markdown { padding: 8px 10px !important; max-height: 480px; overflow-y: auto !important; scrollbar-width: thin; }

                ha-markdown p { margin: 0 !important; }

                ha-markdown table { width: 100%; border-collapse: collapse; }

                ha-markdown td { padding: 2px 4px; font-size: 12px; border-bottom: 1px solid var(--divider-color, #2a2a2a); }

                '
            content: '**Moves**


              {% set moves = state_attr(''sensor.phantom_YOUR_BOARD_MAC_move_history'', ''moves'') or [] %}{% if moves | length == 0 %}

              *No moves yet.*

              {% else %}

              | # | White | Black |

              |---:|:------|:------|

              {%- set num_pairs = (moves | length + 1) // 2 %}{%- for i in range(num_pairs) %}{%- set w = moves[i*2] if (i*2) < (moves | length) else none %}{%- set b = moves[i*2+1] if (i*2+1) < (moves
              | length) else none %}

              | {{ i+1 }} | {% if w %}{{ w.san }} <font color=''{{ w.color }}''>{{ w.glyph }}</font>{% endif %} | {% if b %}{{ b.san }} <font color=''{{ b.color }}''>{{
              b.glyph }}</font>{% endif %} |{%- endfor %}{% endif %}'
        - type: markdown
          card_mod:
            style: 'ha-card { background: var(--card-background-color, #1a1a1a) !important; border: 1px solid var(--divider-color, #333) !important; border-radius: 4px !important; padding: 0 !important; }

              ha-markdown { padding: 10px 14px !important; }

              ha-markdown p { margin: 0 !important; font-size: 13px; }

              '
          content: |-
            {% set mv = states('sensor.phantom_YOUR_BOARD_MAC_firmware_last_move') %}{% set cls = states('sensor.phantom_YOUR_BOARD_MAC_last_move_classification') %}{% set cpl = states('sensor.phantom_YOUR_BOARD_MAC_last_move_cpl') %}{% set motif = states('sensor.phantom_YOUR_BOARD_MAC_last_move_motif') %}{% set cp = states('sensor.phantom_YOUR_BOARD_MAC_eval_cp') %}{% set best = states('sensor.phantom_YOUR_BOARD_MAC_best_move_san') %}{% set src = states('sensor.phantom_YOUR_BOARD_MAC_eval_source') %}{% set color_map = {'brilliant':'#00bcd4','best':'#4caf50','good':'#8bc34a','book':'#795548','inaccuracy':'#ffc107','mistake':'#ff9800','blunder':'#f44336','unknown':'#9e9e9e'} %}{% set glyph_map = {'brilliant':'!!','best':'✓','good':'!','book':'📖','inaccuracy':'?!','mistake':'?','blunder':'??','unknown':'…'} %}{% set color = color_map.get(cls, '#9e9e9e') %}{% set glyph = glyph_map.get(cls, '…') %}{% if mv not in ['', 'unknown'] %}Last move: **{{ mv }}** {% if cls not in ['', 'unknown', 'unavailable'] %}&nbsp;&nbsp;<font color='{{ color }}'><b>{{ glyph }} {{ cls | title }}</b></font>{% endif %}{% if cpl not in ['', 'unknown', 'unavailable'] %}&nbsp;&nbsp;CPL: {{ cpl }}{% endif %}{% if motif not in ['', 'unknown', 'unavailable', 'none'] %}&nbsp;&nbsp;<font color='#80cbc4'>({{ motif | title }})</font>{% endif %}{% if cp not in ['', 'unknown', 'unavailable'] %}{% set cp_i = cp | int(0) %}&nbsp;&nbsp;Eval: **{{ '+' if cp_i >= 0 else '' }}{{ (cp_i/100.0) | round(1) }}**{% endif %}{% else %}*Waiting for first move…*{% endif %}
            {% if is_state('input_boolean.phantom_chess_training_wheels', 'on') and best not in ['', 'unknown', 'unavailable'] %}<font color='#80cbc4'>💡 Engine recommends: **{{ best }}**</font>{% if src not in ['', 'unknown'] %} ({{ src }}){% endif %}{% endif %}
        # SECONDARY actions — compact mushroom grid (C7-dash). Resign keeps
        # its confirmation.
        - type: grid
          columns: 4
          square: false
          cards:
          - type: custom:mushroom-template-card
            primary: Hint
            icon: mdi:lightbulb-outline
            icon_color: amber
            tap_action:
              action: perform-action
              perform_action: phantom_chess.request_hint
              data: {}
            card_mod:
              style: |
                ha-card { min-height: 56px; }
          - type: custom:mushroom-template-card
            primary: Takeback
            icon: mdi:undo-variant
            icon_color: blue
            tap_action:
              action: perform-action
              perform_action: phantom_chess.takeback
              data: {}
            card_mod:
              style: |
                ha-card { min-height: 56px; }
          - type: custom:mushroom-template-card
            primary: Resign
            icon: mdi:flag-outline
            icon_color: red
            tap_action:
              action: perform-action
              perform_action: phantom_chess.resign
              data: {}
              confirmation:
                text: Resign this game?
            card_mod:
              style: |
                ha-card { min-height: 56px; }
          - type: custom:mushroom-template-card
            primary: Training wheels
            icon: mdi:school-outline
            icon_color: "{{ 'amber' if is_state('input_boolean.phantom_chess_training_wheels', 'on') else 'grey' }}"
            entity: input_boolean.phantom_chess_training_wheels
            tap_action:
              action: toggle
            card_mod:
              style: |
                ha-card { min-height: 56px; }
    # ── Post-game review (C7-dash compact buttons) ─────────────────────────
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_lichess_review_ready
        state: 'on'
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_lichess_active
        state: 'off'
      - condition: state
        entity: binary_sensor.phantom_YOUR_BOARD_MAC_connected
        state: 'on'
      card:
        type: vertical-stack
        cards:
        - type: custom:mushroom-chips-card
          alignment: justify
          chips:
          - type: template
            icon: mdi:arrow-left
            content: Back
            tap_action:
              action: perform-action
              perform_action: phantom_chess.back_to_modes
              data: {}
        - type: markdown
          content: "### Game review\n{% set result = states('sensor.phantom_YOUR_BOARD_MAC_last_game_result') %}{% set wa = states('sensor.phantom_YOUR_BOARD_MAC_last_game_accuracy_white') %}{%\
            \ set ba = states('sensor.phantom_YOUR_BOARD_MAC_last_game_accuracy_black') %}Result: **{{ result if result not in ['', 'unknown'] else '—' }}**  \nAccuracy — White {{ wa if wa\
            \ not in ['', 'unknown'] else '—' }}% \xB7 Black {{ ba if ba not in ['', 'unknown'] else '—' }}%"
        - type: markdown
          card_mod:
            style: 'ha-card { background: var(--card-background-color, #1a1a1a) !important; border: 1px solid var(--divider-color, #333) !important; border-radius: 4px !important; padding: 0 !important; }

              ha-markdown { padding: 12px 16px !important; }

              '
          content: |-
            **Your three biggest mistakes**

            {% set mistakes = state_attr('sensor.phantom_YOUR_BOARD_MAC_last_game_review', 'top_mistakes') or [] %}{% if mistakes | length == 0 %}
            *No analysis yet for this game.*
            {% else %}
            {% set color_map = {'inaccuracy':'#ffc107','mistake':'#ff9800','blunder':'#f44336'} %}{% for m in mistakes %}{% set c = color_map.get(m.classification, '#9e9e9e') %}<font color='{{ c }}'>▎ <b>Move {{ m.move_num }}. {{ m.san }} — {{ m.classification | title }}</b></font> (lost {{ (m.cpl/100.0) | round(1) }} pawns)<br>Best was <b>{{ m.best_san }}</b>{% if m.description %} — {{ m.description }}{% endif %}<br><br>{% endfor %}{% endif %}
        # v0.4-alpha32: "Reset board" drives the magnet from the current
        # position back to the start (same snapshot path as a normal AI
        # move, starting FEN as target). SECONDARY actions — compact
        # mushroom grid (C7-dash).
        - type: grid
          columns: 3
          square: false
          cards:
          - type: custom:mushroom-template-card
            primary: Reset board
            icon: mdi:restart
            icon_color: orange
            tap_action:
              action: perform-action
              perform_action: phantom_chess.reset_position
              data: {}
            card_mod:
              style: |
                ha-card { min-height: 56px; }
          - type: custom:mushroom-template-card
            primary: New game
            icon: mdi:plus-circle-outline
            icon_color: green
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              data:
                entity_id: input_select.phantom_chess_setup_mode
                option: Choose a mode
            card_mod:
              style: |
                ha-card { min-height: 56px; }
          - type: custom:mushroom-template-card
            primary: Training wheels
            icon: mdi:school-outline
            icon_color: "{{ 'amber' if is_state('input_boolean.phantom_chess_training_wheels', 'on') else 'grey' }}"
            entity: input_boolean.phantom_chess_training_wheels
            tap_action:
              action: toggle
            card_mod:
              style: |
                ha-card { min-height: 56px; }
