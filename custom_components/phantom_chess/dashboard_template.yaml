            }, \"1956 \u2014 Byrne vs Fischer (Game of the Century)\": {\"white\": \"Donald Byrne\", \"black\": \"Robert James Fischer\", \"date\": \"1956.10.17\", \"site\": \"New York, NY USA\", \"result\"\
            : \"0-1\", \"eco\": \"D92\", \"significance\": \"Dubbed the 'Game of the Century,' this game featured a 13-year-old Fischer defeating master Donald Byrne with a stunning queen sacrifice in a\
