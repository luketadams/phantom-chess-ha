# Repository-level Python tooling config.
#
# Kept minimal on purpose — this is a Home Assistant custom integration,
# not a PyPI-published package. There's no package definition here; the
# integration is shipped via HACS, which reads custom_components/phantom_chess/
# directly. This file exists so pytest picks up consistent settings in
# CI and in local runs.

[tool.pytest.ini_options]
# pytest-homeassistant-custom-component wires the `hass` fixture as an
# async fixture. With pytest-asyncio's default "strict" mode, every
# async test would need an explicit `@pytest.mark.asyncio` decorator,
# which the HA test pattern doesn't add. "auto" mode marks every
# `async def test_*` as asyncio automatically, matching HA's test
# conventions.
asyncio_mode = "auto"

# Filter the noisy "pytest 9 will break this" warning that
# pytest-homeassistant-custom-component triggers in our pinned version
# range. Re-evaluate when bumping pytest beyond 9.x.
filterwarnings = [
    "ignore::pytest.PytestRemovedIn9Warning",
]

[tool.coverage.run]
# Scope coverage to the integration package only; tests + outputs files
# don't need to be measured.
source = ["custom_components/phantom_chess"]
branch = false

[tool.coverage.report]
# Lines that should NOT count against coverage. Standard patterns plus
# defensive branches that handle bleak / aiohttp edge cases not
# reachable from unit tests.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    # Defensive imports for optional dependencies
    "except ImportError:",
]
# Don't fail the build below this percentage. Set at 40% — the
# alpha12 baseline is 42.7% combined (matrix-tests + ha-tests
# exercise entity platforms via HA's setup machinery), so 40% locks
# in the gain with a small buffer for noise. Bump as coverage grows;
# the Silver `test-coverage` rule's 95% target is a multi-alpha goal.
fail_under = 40
skip_empty = true
precision = 1
