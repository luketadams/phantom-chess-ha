# Repository-level Python tooling config.
#
# Kept minimal on purpose — this is a Home Assistant custom integration,
# not a PyPI-published package. There's no package definition here; the
# integration is shipped via HACS, which reads custom_components/phantom_chess/
# directly. This file exists so pytest picks up consistent settings in
# CI and in local runs.

[tool.pytest.ini_options]
# pytest-homeassistant-custom-component wires the `hass` fixture as an
# async fixture. With pytest-asyncio's default "strict" mode, every
# async test would need an explicit `@pytest.mark.asyncio` decorator,
# which the HA test pattern doesn't add. "auto" mode marks every
# `async def test_*` as asyncio automatically, matching HA's test
# conventions.
asyncio_mode = "auto"

# Filter the noisy pytest-deprecation warning that
# pytest-homeassistant-custom-component triggers. This was originally
# ``ignore::pytest.PytestRemovedIn9Warning``, but pytest removed that
# category in 9.1 (renamed to PytestRemovedIn10Warning), so referencing
# the class by name crashed collection under pytest >= 9.1 with
# ``AttributeError: module 'pytest' has no attribute
# 'PytestRemovedIn9Warning'``. Match by message instead so the filter is
# robust across pytest 9.0 → 9.1+ without naming a category that may not
# exist. See FINDINGS_TEST_PORTABILITY.md.
filterwarnings = [
    "ignore:.*is deprecated.*:Warning",
]

[tool.coverage.run]
# Scope coverage to the integration package only; tests + outputs files
# don't need to be measured.
source = ["custom_components/phantom_chess"]
branch = false

[tool.coverage.report]
# Lines that should NOT count against coverage. Standard patterns plus
# defensive branches that handle bleak / aiohttp edge cases not
# reachable from unit tests.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    # Defensive imports for optional dependencies
    "except ImportError:",
]
# Don't fail the build below this percentage. Bump as coverage grows.
# - alpha12 baseline: 42.7% → fail_under=40 (locked in with 2.7 buffer)
# - alpha13 added coordinator state-handler tests → 43.7%, bumped to 42
# - alpha14 added diagnostics tests → 44.5%, bumped to 43
# - beta3 added the BLE-mocked coordinator suite (tests/ble_mock.py harness +
#   test_coordinator_ble / test_coord_* / test_coord_discovery /
#   test_coverage_gaps) → 95.4% combined, satisfying the Silver
#   `test-coverage` rule's 95% threshold. Locked in at 95.
fail_under = 95
skip_empty = true
precision = 1
