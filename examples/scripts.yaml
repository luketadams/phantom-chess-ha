    - conditions:
      - condition: state
        entity_id: input_select.phantom_chess_sculpture_game
        state: 1851 — Anderssen vs Kieseritzky (Immortal Game)
      sequence:
      - service: script.turn_on
        target:
          entity_id: script.phantom_sculpture_1851_adolf_anderssen_lionel_kieseritzky
    - conditions:
      - condition: state
        entity_id: input_select.phantom_chess_sculpture_game
        state: 1858 — Morphy's Opera Game
