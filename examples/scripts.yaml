# Phantom Chess Board — companion scripts for the rich dashboard.

#

# Paste this into your `scripts.yaml` (or under a top-level `script:` key in

# `configuration.yaml`). Reload Scripts (Developer Tools → YAML →

# Scripts), or restart Home Assistant.

#

# Find/replace: `c8_c9_a3_f2_7c_0a` → your board's MAC-slug (lowercase, underscores).

# Find your slug by looking at any phantom_chess sensor entity_id, e.g.

# `sensor.phantom_xx_xx_xx_xx_xx_xx_battery` — the `xx_xx_xx_xx_xx_xx` part

# is your slug.



phantom_play_selected_sculpture:
  alias: Phantom Sculpture — Play Selected Game
  description: Reads input_select.phantom_chess_sculpture_game and dispatches to the
    matching per-game script.
  mode: single
  sequence:
