phantom_start_lichess_configured:
  alias: Phantom — Start Lichess Game (with configured options)
  description: Starts a Lichess Board API game using the AI level, color, and time
    control settings from the chess dashboard helpers.
  mode: single
  sequence:
  - service: phantom_chess.start_game
    data:
      ai_level: '{{ states(''select.phantom_c8_c9_a3_f2_7c_0a_ai_level'') | int }}'
      color: '{{ states(''select.phantom_c8_c9_a3_f2_7c_0a_player_color'') }}'
      clock_limit_seconds: '{{ states(''input_number.phantom_chess_lichess_clock_minutes'')
        | int * 60 }}'
      clock_increment_seconds: '{{ states(''input_number.phantom_chess_lichess_clock_increment'')
        | int }}'

phantom_back_to_modes:
  alias: Phantom — Back to Mode Picker
  description: Resets dashboard to mode picker. Clears the post-game review flag and
    resets the setup-mode selector.
  mode: single
  sequence:
  - action: phantom_chess.dismiss_review
  - data:
      entity_id: input_select.phantom_chess_setup_mode
      option: Choose a mode
    action: input_select.select_option

phantom_resign:
  alias: Phantom Chess - Resign
  icon: mdi:flag-outline
  mode: single
  sequence:
  - action: phantom_chess.resign

phantom_takeback:
  alias: Phantom Chess - Takeback
  icon: mdi:undo-variant
  mode: single
  sequence:
  - action: phantom_chess.takeback

phantom_request_hint:
  alias: Phantom Chess - Request Hint
  icon: mdi:lightbulb-outline
  mode: single
  sequence:
  - action: phantom_chess.request_hint

phantom_chess_play:
  alias: Phantom Chess - Voice Play
  description: "Start a chess game on the Phantom Chess board. The user is a beginner
    playing on a physical chessboard against the Stockfish AI — either via Lichess
    (online, can be reviewed on their account) or via the local Stockfish engine (offline,
    no rating impact). Invoke this script when the user wants to start a game, e.g.
    \"let's play chess\", \"play a game of chess\", \"Jarvis, start chess\". Elicit
    missing parameters before calling:\n  - color: white, black, or random (default:
    random)\n  - ai_level: 1 to 8 (1 easiest, 8 hardest — beginner-friendly range\n
    \   is 3 to 5; default: 5)\n  - mode: lichess (online) or local (offline) — if
    the user doesn't\n    say, ask which they prefer; default to lichess if unclear.\nIf
    a game is already in progress (learning_view_active is on), do NOT start a new
    one — tell the user a game is running and offer to resign the current one if they
    want a new game."
  mode: single
  fields:
    color:
      description: Side to play — white, black, or random
      example: white
      selector:
        select:
          options:
          - white
          - black
          - random
    ai_level:
      description: Stockfish AI difficulty (1 easiest, 8 hardest)
      example: 5
      selector:
        number:
          min: 1
          max: 8
          step: 1
    mode:
      description: lichess (online, rated games on your account) or local (offline
        Stockfish)
      example: lichess
      selector:
        select:
          options:
          - lichess
          - local
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.phantom_c8_c9_a3_f2_7c_0a_learning_view_active
        state: 'on'
      sequence:
      - service: persistent_notification.create
        data:
          title: 'Phantom Chess: game already in progress'
          message: 'A chess game is already running. Finish or resign the current
            game before starting a new one. (Tip: ask Jarvis to "resign the current
            chess game".)'
          notification_id: phantom_chess_voice_blocked
      - stop: A game is already in progress
  - variables:
      chosen_color: '{{ color | default(''random'') }}'
      chosen_level: '{{ (ai_level | default(5)) | int }}'
      chosen_mode: '{{ mode | default(''lichess'') }}'
  - choose:
    - conditions: '{{ chosen_mode == ''local'' }}'
      sequence:
      - service: phantom_chess.start_local_game
        data:
          color: '{{ chosen_color }}'
    default:
    - service: phantom_chess.start_game
      data:
        ai_level: '{{ chosen_level }}'
        color: '{{ chosen_color }}'
